<style>
:root{--serif:"Noto Serif SC","Songti SC","SimSun",serif;--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--gold:#d8b866;--gold2:#f0d79b;--ink:#eef2f8;--dim:#9fb2cc;--panel:rgba(11,18,34,.92)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

/* 顶部 HUD */
.m3d-top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 12px;

.m3d-brand{display:flex;align-items:center;gap:9px;min-width:0}

 display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:900;font-size:21px;background:rgba(216,184,102,.12);transform:rotate(-3deg)}
.m3d-title{font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:3px;text-indent:3px;color:#f4f6fa;white-space:nowrap}

.m3d-ibtn svg{width:21px;height:21px}

/* 搜索 */
.m3d-search{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:45;width:min(520px,92vw)}
.m3d-search input{width:100%;padding:12px 16px;border-radius:10px;border:1px solid rgba(216,184,102,.4);
 background:rgba(13,22,40,.95);color:var(--ink);font-size:14px;letter-spacing:1px;outline:none;backdrop-filter:blur(6px)}
.m3d-search input::placeholder{color:#6d7f9c}
.m3d-suggest{margin-top:6px;border-radius:10px;overflow:hidden;border:1px solid rgba(216,184,102,.25);background:rgba(13,22,40,.96);max-height:46vh;overflow-y:auto}
.s-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;font-size:13.5px;color:#dbe4f2;border-bottom:1px solid rgba(255,255,255,.06)}
.s-item:active{background:rgba(216,184,102,.12)}
.s-tag{flex:none;font-size:10.5px;padding:2px 7px;border-radius:3px;border:1px solid rgba(216,184,102,.45);color:var(--gold2)}
.s-empty{padding:14px;font-size:12.5px;color:var(--dim);text-align:center}

/* 进度条 */
.m3d-progress{position:fixed;top:58px;left:0;right:0;z-index:35;height:2px;background:rgba(255,255,255,.1)}
.m3d-progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .5s ease}

/* 时间轴 chips */
.m3d-chipbar{position:fixed;left:0;right:0;bottom:62px;z-index:30;display:flex;gap:7px;overflow-x:auto;cursor:grab;padding:6px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;opacity:0;transition:opacity .5s}

 background:rgba(10,18,32,.74);color:#aebcd2;text-align:center;transition:all .15s}

 backdrop-filter:blur(10px);border-left:1px solid rgba(216,184,102,.22);display:none;flex-direction:column;box-shadow:-12px 0 36px rgba(0,0,0,.5)}

.dyn-title{font-family:var(--serif);font-size:14px;letter-spacing:3px;color:var(--gold2);flex:1;padding:2px 4px}
.dyn-rail{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-bottom:1px solid rgba(255,255,255,.07)}

.dyn-hero .dh-year{font-size:12px;color:var(--dim);letter-spacing:1px}

.dyn-empty{font-size:12px;color:var(--dim);padding:14px;text-align:center;border:1px dashed rgba(255,255,255,.15);border-radius:9px}

.m3d-dynaxis{position:fixed;left:0;right:0;bottom:118px;z-index:29;height:36px;cursor:grab;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;background:linear-gradient(180deg,rgba(8,13,26,.93),rgba(10,17,30,.96));border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(216,184,102,.18)}
.m3d-dynaxis::-webkit-scrollbar{display:none}

.dynaxis-seg:active{filter:brightness(1.3)}

.dyn-sec{margin:10px 0;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.04);border-left:3px solid rgba(216,184,102,.65)}

.dyn-sec p{font-size:12.5px;line-height:1.85;color:#b9c6da}
.dyn-empbtn{display:block;width:100%;margin:4px 0 10px;padding:9px;border-radius:9px;border:1px solid rgba(216,184,102,.5);background:rgba(216,184,102,.1);color:var(--gold2);font-size:13px;letter-spacing:2px;font-family:var(--serif);font-weight:700}
.dyn-empbtn:active{transform:scale(.98)}
.dyn-empbtn.rel{border-color:rgba(158,203,255,.55);background:rgba(158,203,255,.1);color:#a8ccf0}
.rel-box{margin:8px 0 4px;border-radius:12px;background:rgba(6,10,20,.72);overflow-x:auto;padding:8px;-webkit-overflow-scrolling:touch}
.rel-svg{display:block;width:100%;min-width:640px;height:auto}
.emp-wrap{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow-y:auto;padding-right:4px;-webkit-overflow-scrolling:touch}
.emp-group h4.emp-gname{font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:6px;border-bottom:1px dashed rgba(255,255,255,.12);padding-bottom:4px}
.emp-tree{display:flex;flex-wrap:wrap;align-items:center;gap:5px 0}

.emp-node b{font-size:12px;color:#f0f4fb;font-weight:700;line-height:1.3}
.emp-node i{font-size:9px;color:var(--gold);font-style:normal}
.emp-node s{font-size:9px;color:var(--dim);text-decoration:none}
.emp-arrow{color:rgba(216,184,102,.75);font-size:13px;padding:0 3px}
.dynaxis-seg .da-txt{font-size:10px;letter-spacing:1px;color:#eef3fa;font-family:var(--serif);font-weight:700;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.dynaxis-seg .da-year{font-size:8px;color:rgba(238,243,250,.72);margin-left:3px;white-space:nowrap}

.m3d-list{flex:1;overflow-y:auto;padding:8px 10px 110px;-webkit-overflow-scrolling:touch}

.l-main{flex:1;min-width:0}
.l-name{display:block;font-size:14px;color:#eef3fa;letter-spacing:.5px;line-height:1.4}
.l-name i{font-style:normal;color:var(--gold);margin:0 2px}
.l-time{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.l-go{flex:none;color:#5d7090;font-size:18px}

.book-group h4{font-family:var(--serif);font-size:13px;letter-spacing:2px;color:var(--gold2);padding:8px 4px 6px}
.b-item{display:flex;gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:9px;margin-bottom:4px;transition:background .15s}
.b-item:active{background:rgba(216,184,102,.12)}
.b-tag{flex:none;font-size:10px;padding:2px 6px;border-radius:3px;border:1px solid rgba(158,203,255,.4);color:#9ecbff;height:fit-content;margin-top:2px}

.b-main{min-width:0}
.b-name{display:block;font-size:13.5px;color:#eef3fa}
.b-desc{display:block;font-size:11px;color:var(--dim);margin-top:3px;line-height:1.6}

.m3d-mask{position:fixed;inset:0;z-index:55;background:rgba(4,8,16,.5);display:none}.m3d-modal{position:fixed;inset:0;z-index:65;display:none;align-items:center;justify-content:center;padding:16px;pointer-events:none}

.m3d-modal-inner{pointer-events:auto;width:min(620px,100%);max-height:min(86vh,760px);overflow-y:auto;border-radius:14px;
 background:linear-gradient(180deg,rgba(15,25,45,.98),rgba(10,17,32,.98));border:1px solid rgba(216,184,102,.28);
 box-shadow:0 24px 70px rgba(0,0,0,.6);padding:18px 20px 16px;-webkit-overflow-scrolling:touch;animation:m3dUp .25s ease}

.d-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.d-cat{flex:none;font-size:11px;letter-spacing:1px;border:1px solid;border-radius:3px;padding:2px 8px}
.d-time{font-size:12px;color:var(--dim);letter-spacing:1px}
.d-title{font-family:var(--serif);font-size:22px;font-weight:900;letter-spacing:2px;color:#f6f8fc;line-height:1.4;margin-bottom:7px}
.d-title .d-arrow{font-style:normal;color:var(--gold);margin:0 8px}
.d-subtitle{font-size:13px;color:var(--gold2);letter-spacing:1px;margin-bottom:7px}
.d-intro{font-size:13.5px;line-height:1.9;color:#c9d6e8}
.d-section{margin-top:13px}
.d-section h5{font-size:12px;letter-spacing:2px;color:var(--gold2);margin-bottom:6px;padding-left:8px;border-left:3px solid var(--gold)}
.d-section p{font-size:13px;line-height:1.85;color:#b9c6da}
.d-story{margin-top:9px;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09)}
.d-story h6{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:4px}
.d-story p{font-size:12.5px;line-height:1.8;color:#b9c6da}
.d-todo{color:#7c8aa5;font-size:12px}
.d-route{color:#8fe0a0}
.d-chips{display:flex;flex-wrap:wrap;gap:7px}
.d-chip{font-size:12px;padding:5px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.18);color:#dbe4f2;background:rgba(255,255,255,.05);transition:background .15s}
.d-chip:active{background:rgba(216,184,102,.18)}
.d-books{display:flex;flex-direction:column;gap:6px}
.d-book{display:flex;align-items:center;gap:8px;text-align:left;font-size:12.5px;color:#c9d6e8;padding:8px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}

.d-sep{height:1px;background:rgba(255,255,255,.08);margin:14px 0 10px}
.d-navrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.d-nav{font-size:12.5px;padding:8px 14px;border-radius:8px;border:1px solid rgba(216,184,102,.4);color:var(--gold2);letter-spacing:1px}
.d-nav:active{background:rgba(216,184,102,.15)}
.d-pos{font-size:11.5px;color:var(--dim)}

/* 加载 */
.m3d-loading{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:#0a111e;color:var(--dim);font-size:14px;letter-spacing:2px}
.m3d-spin{width:42px;height:42px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--gold);border-radius:50%;animation:mspin 1s linear infinite}
@keyframes mspin{to{transform:rotate(360deg)}}
#m3dToast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);z-index:90;background:rgba(13,22,40,.95);
 border:1px solid rgba(216,184,102,.4);color:#f0f4fb;font-size:13px;padding:10px 18px;border-radius:9px;opacity:0;transition:all .3s;pointer-events:none}
#m3dToast.show{opacity:1;transform:translateX(-50%)}

 {y:-2070,time:"约前2070",era:"夏",name:"夏朝建立 · 家天下",lon:113.03,lat:34.46,cat:"政",desc:"禹建立夏朝，启以王位世袭制取代禅让制，「公天下」变为「家天下」，我国早期国家产生。"},
 {y:-1300,time:"约前1300",era:"商",name:"盘庚迁殷",lon:114.39,lat:36.10,cat:"政",desc:"商王盘庚迁都到殷（今河南安阳），商朝统治稳定下来，因此商朝又称殷商。"},
 {y:-1046,time:"前1046",era:"商末",name:"武王伐纣 · 牧野之战",lon:113.93,lat:35.31,cat:"战",desc:"周武王率军在牧野大败商军，商朝灭亡，西周建立，实行分封制与宗法制。"},
 {y:-770,time:"前770",era:"东周",name:"平王东迁",lon:112.45,lat:34.62,cat:"政",desc:"周平王迁都洛邑（今洛阳），史称东周，中国进入春秋战国大变革时代。"},
 {y:-356,time:"前356",era:"战国",name:"商鞅变法",lon:108.71,lat:34.33,cat:"政",desc:"秦孝公支持商鞅变法，废井田、奖耕战、行县制，秦国一跃而强，为统一六国奠基。"},
 {y:-256,time:"约前256",era:"战国",name:"都江堰建成",lon:103.62,lat:30.99,cat:"工",desc:"秦国蜀郡郡守李冰父子主持修建都江堰，使成都平原成为「天府之国」，至今仍在发挥作用。"},
 {y:-221,time:"前221",era:"秦",name:"秦统一六国",lon:108.71,lat:34.33,cat:"政",desc:"秦王嬴政完成统一，建立我国历史上第一个统一的多民族中央集权封建国家，自称始皇帝。"},
 {y:-214,time:"前214",era:"秦",name:"修筑万里长城",lon:103.86,lat:35.39,cat:"工",rt:[[103.9,35.4],[106.3,38.5],[109.8,40.6],[111.7,40.8],[114.9,40.8],[117.9,40.95],[121.0,41.4],[123.2,41.2]],desc:"秦连接并修缮战国长城，筑起西起临洮、东到辽东的万里长城，抵御匈奴南下。"},
 {y:-209,time:"前209",era:"秦末",name:"陈胜吴广起义",lon:116.98,lat:33.64,cat:"战",desc:"陈胜、吴广在大泽乡揭竿而起，是中国历史上第一次大规模农民大起义，秦朝速亡。"},
 {y:-202,time:"前202",era:"西汉",name:"西汉建立",lon:108.94,lat:34.27,cat:"政",desc:"刘邦建立汉朝，定都长安（今西安），经文景之治，至汉武帝时进入鼎盛。"},
 {y:-138,time:"前138",era:"西汉",name:"张骞通西域",lon:108.94,lat:34.27,cat:"交",rt:[[108.94,34.27],[103.83,36.06],[102.64,37.93],[100.45,38.93],[94.66,40.14],[93.51,42.82],[89.18,42.95],[76.0,39.47]],desc:"张骞两次出使西域，史称「凿空」，贯通长安到中亚的丝绸之路，东西方交流由此大开。"},
 {y:-134,time:"前134",era:"西汉",name:"罢黜百家 独尊儒术",lon:108.94,lat:34.27,cat:"文",desc:"汉武帝采纳董仲舒建议，把儒家学说确立为正统思想，影响中国两千余年。"},
 {y:-91,time:"约前91",era:"西汉",name:"司马迁著《史记》",lon:108.94,lat:34.27,cat:"文",desc:"司马迁撰成我国第一部纪传体通史《史记》，记述黄帝到汉武帝时期的史事。"},
 {y:105,time:"105",era:"东汉",name:"蔡伦改进造纸术",lon:112.45,lat:34.62,cat:"工",desc:"蔡伦用树皮、麻头、破布改进造纸工艺，纸逐渐普及，深刻改变了文明传播。"},
 {y:208,time:"208",era:"东汉末",name:"赤壁之战",lon:113.90,lat:29.72,cat:"战",desc:"孙刘联军在赤壁以少胜多大败曹军，奠定了魏、蜀、吴三国鼎立的基础。"},
 {y:383,time:"383",era:"东晋",name:"淝水之战",lon:116.78,lat:32.58,cat:"战",desc:"东晋以少胜多大败前秦，北方再度分裂，江南相对安定，经济继续开发。"},
 {y:494,time:"494",era:"北魏",name:"孝文帝迁都改革",lon:112.45,lat:34.62,cat:"政",desc:"北魏孝文帝迁都洛阳，推行说汉话、穿汉服、与汉族通婚等汉化措施，促进民族大交融。"},
 {y:589,time:"589",era:"隋",name:"隋重新统一全国",lon:108.94,lat:34.27,cat:"政",desc:"隋灭陈，结束了自西晋末年以来近三百年的分裂割据局面，南北重归一统。"},
 {y:605,time:"605起",era:"隋",name:"开凿大运河",lon:116.40,lat:39.90,cat:"工",rt:[[116.40,39.90],[115.0,35.8],[114.3,34.8],[112.45,34.62],[117.0,33.5],[119.42,32.39],[120.15,30.27]],desc:"隋炀帝时开凿以洛阳为中心、北达涿郡南至余杭的大运河，是古代世界最长的运河。"},
 {y:605,time:"605",era:"隋",name:"科举制创立",lon:112.45,lat:34.62,cat:"政",desc:"隋炀帝设立进士科，按考试成绩选拔人才，科举制正式诞生，沿用约一千三百年。"},
 {y:618,time:"618",era:"唐",name:"唐朝建立",lon:108.94,lat:34.27,cat:"政",desc:"李渊建立唐朝，定都长安。此后出现贞观之治与开元盛世，唐朝成为当时世界瞩目的强盛帝国。"},
 {y:627,time:"627起",era:"唐",name:"玄奘西行取经",lon:108.94,lat:34.27,cat:"交",rt:[[108.94,34.27],[103.83,36.06],[94.66,40.14],[89.18,42.95],[76.0,39.47],[71.5,34.0],[85.4,25.0]],desc:"高僧玄奘西行天竺（古印度）求取佛经，口述《大唐西域记》，是中印文化交流的丰碑。"},
 {y:641,time:"641",era:"唐",name:"文成公主入藏",lon:108.94,lat:34.27,cat:"交",rt:[[108.94,34.27],[101.78,36.62],[98.2,34.9],[92.07,31.48],[91.14,29.65]],desc:"文成公主远嫁吐蕃赞普松赞干布，带去中原技术与文化，促进了吐蕃发展与汉藏友好。"},
 {y:754,time:"754",era:"唐",name:"鉴真东渡日本",lon:119.42,lat:32.39,cat:"交",rt:[[119.42,32.39],[121.8,30.9],[127.7,26.3],[130.6,31.6],[135.8,34.68]],desc:"鉴真六次东渡终抵日本，传授佛法与唐朝建筑、医学文化，主持修建唐招提寺。"},
 {y:755,time:"755",era:"唐",name:"安史之乱",lon:116.40,lat:39.90,cat:"战",desc:"安禄山、史思明从范阳（今北京一带）起兵叛乱，持续八年，是唐朝由盛转衰的转折点。"},
 {y:960,time:"960",era:"北宋",name:"陈桥兵变 · 北宋建立",lon:114.30,lat:34.80,cat:"政",desc:"赵匡胤在陈桥驿黄袍加身，建立北宋，定都东京（今开封），推行重文轻武国策。"},
 {y:1040,time:"约1040",era:"北宋",name:"毕昇发明活字印刷",lon:114.30,lat:34.80,cat:"工",desc:"平民毕昇发明泥活字印刷术，比欧洲约早四百年，推动了世界文化的传播。"},
 {y:1127,time:"1127",era:"两宋",name:"靖康之变",lon:114.30,lat:34.80,cat:"战",desc:"金军攻破东京，掳走徽、钦二帝，北宋灭亡；同年赵构在南方建立南宋。"},
 {y:1140,time:"1140",era:"南宋",name:"岳飞郾城大捷",lon:114.02,lat:33.58,cat:"战",desc:"岳飞率岳家军在郾城大败金军主力，后被宋高宗与秦桧以「莫须有」罪名杀害。"},
 {y:1206,time:"1206",era:"蒙古",name:"成吉思汗统一蒙古",lon:102.82,lat:47.20,cat:"政",desc:"铁木真完成蒙古草原统一，被尊为成吉思汗，建立蒙古政权，此后蒙古铁骑横扫欧亚。"},
 {y:1279,time:"1279",era:"元",name:"元朝统一全国",lon:116.40,lat:39.90,cat:"政",desc:"忽必烈改国号为元、定都大都（今北京），1279年攻灭南宋，创立行省制度，疆域空前辽阔。"},
 {y:1368,time:"1368",era:"明",name:"明朝建立",lon:118.80,lat:32.06,cat:"政",desc:"朱元璋在应天（今南京）称帝建立明朝，同年北伐推翻元朝，后废丞相、强化皇权。"},
 {y:1405,time:"1405起",era:"明",name:"郑和下西洋",lon:121.20,lat:31.45,cat:"交",rt:[[118.8,32.06],[121.2,31.45],[119.3,25.9],[118.6,24.9],[113.3,23.1],[108.2,15.9],[105.0,10.5],[102.3,2.2],[80.3,6.0],[79.8,7.0]],desc:"郑和率船队七下西洋，最远到达非洲东海岸和红海沿岸，是世界航海史上的壮举。"},
 {y:1421,time:"1421",era:"明",name:"迁都北京",lon:116.40,lat:39.90,cat:"政",desc:"明成祖正式迁都北京，营建紫禁城，北京从此成为明清两代的政治中心。"},
 {y:1561,time:"1561",era:"明",name:"戚继光抗倭",lon:121.15,lat:28.85,cat:"战",desc:"戚继光率戚家军在台州九战九捷，与其他将领合作，基本平息东南沿海倭患。"},
 {y:1644,time:"1644",era:"明末",name:"李自成进京 · 明朝灭亡",lon:116.40,lat:39.90,cat:"战",desc:"李自成农民军攻入北京，崇祯帝自缢，明朝灭亡；同年清军在吴三桂引导下入关。"},
 {y:1644,time:"1644",era:"明清",name:"清军入关 · 山海关之战",lon:119.76,lat:40.01,cat:"战",desc:"清军在山海关击败李自成军后大举入关，迁都北京，逐步确立对全国的统治。"},
 {y:1662,time:"1662",era:"清初",name:"郑成功收复台湾",lon:120.22,lat:23.00,cat:"战",desc:"郑成功击败盘踞台湾38年的荷兰殖民者，收复台湾，维护了国家领土主权。"},
 {y:1685,time:"1685",era:"清",name:"雅克萨之战",lon:123.90,lat:52.95,cat:"战",desc:"康熙帝两次组织雅克萨自卫反击战，挫败沙俄侵略，1689年签订平等的《尼布楚条约》。"},
 {y:1684,time:"1684",era:"清",name:"清朝设置台湾府",lon:120.22,lat:23.00,cat:"政",desc:"清政府设置台湾府，隶属福建省，加强了台湾与祖国大陆的联系，巩固了东南海防。"},
 {y:1729,time:"1729",era:"清",name:"设立军机处",lon:116.40,lat:39.90,cat:"政",desc:"雍正帝设立军机处，军国大事由皇帝裁决，标志着我国封建君主专制进一步强化。"},
 {y:1839,time:"1839",era:"晚清",name:"虎门销烟",lon:113.67,lat:22.82,cat:"政",desc:"林则徐在广东虎门海滩当众销毁收缴的鸦片，显示了中华民族反抗外来侵略的坚强意志。"},
 {y:1840,time:"1840",era:"晚清",name:"鸦片战争 · 国门洞开",lon:118.80,lat:32.06,cat:"战",desc:"英国发动鸦片战争，战后签订《南京条约》，中国开始沦为半殖民地半封建社会，是中国近代史的开端。"},
 {y:1851,time:"1851",era:"晚清",name:"太平天国金田起义",lon:110.07,lat:23.40,cat:"战",desc:"洪秀全在广西桂平金田村发动起义，建号太平天国，是中国历史上规模最宏大的一次农民战争。"},
 {y:1861,time:"1861起",era:"晚清",name:"洋务运动兴起",lon:121.47,lat:31.23,cat:"政",desc:"洋务派以「自强」「求富」为口号创办近代工业与新式海军，是中国近代化的开端。"},
 {y:1894,time:"1894",era:"晚清",name:"甲午中日战争",lon:123.50,lat:39.50,cat:"战",desc:"黄海海战中邓世昌等将士壮烈殉国；战后签订《马关条约》，中国半殖民地化程度大大加深。"},
 {y:1898,time:"1898",era:"晚清",name:"戊戌变法",lon:116.40,lat:39.90,cat:"政",desc:"康有为、梁启超推动光绪帝变法图强，历时百余日即遭慈禧镇压，又称百日维新。"},
 {y:1911,time:"1911",era:"清末",name:"辛亥革命 · 武昌起义",lon:114.31,lat:30.59,cat:"战",desc:"武昌起义爆发，各省纷纷响应，推翻了清王朝，结束了中国两千多年的君主专制制度。"},
 {y:1919,time:"1919",era:"民国",name:"五四运动",lon:116.40,lat:39.90,cat:"政",desc:"巴黎和会外交失败引发五四爱国运动，是中国新民主主义革命的开端，促进了马克思主义传播。"},
 {y:1921,time:"1921",era:"民国",name:"中共一大召开",lon:120.75,lat:30.75,cat:"政",desc:"中国共产党第一次全国代表大会在上海召开、浙江嘉兴南湖闭幕，中国共产党诞生。"},
 {y:1927,time:"1927",era:"民国",name:"南昌起义",lon:115.86,lat:28.68,cat:"战",desc:"周恩来、朱德等领导南昌起义，打响了武装反抗国民党反动派的第一枪，是建军的开端。"},
 {y:1928,time:"1928",era:"民国",name:"井冈山会师",lon:114.06,lat:26.57,cat:"政",desc:"朱德、陈毅率部与毛泽东领导的秋收起义部队在井冈山会师，开辟农村包围城市的革命道路。"},
 {y:1931,time:"1931",era:"民国",name:"九一八事变",lon:123.43,lat:41.80,cat:"战",desc:"日本关东军蓄意制造九一八事变并侵占中国东北，中国人民的局部抗战开始。"},
 {y:1934,time:"1934—1936",era:"民国",name:"红军二万五千里长征",lon:116.03,lat:25.89,cat:"战",rt:[[116.03,25.89],[113.0,25.8],[109.7,27.7],[106.93,27.69],[105.7,28.58],[102.45,26.3],[102.23,29.91],[102.9,30.8],[103.6,33.0],[103.9,34.1],[105.05,35.70],[108.18,36.93],[109.49,36.59]],desc:"中央红军从瑞金出发，四渡赤水、飞夺泸定桥、爬雪山过草地，三大主力会师西北，实现战略大转移。"},
 {y:1936,time:"1936",era:"民国",name:"西安事变",lon:108.94,lat:34.27,cat:"政",desc:"张学良、杨虎城发动兵谏逼蒋抗日，事变和平解决，十年内战基本停止，抗日民族统一战线初步形成。"},
 {y:1937,time:"1937",era:"民国",name:"七七事变 · 全面抗战",lon:116.21,lat:39.85,cat:"战",desc:"日军在卢沟桥挑起七七事变，中国全民族抗战由此开始，国共合作筑起抗日民族统一战线。"},
 {y:1937,time:"1937",era:"民国",name:"南京大屠杀",lon:118.80,lat:32.06,cat:"战",desc:"日军攻陷南京后制造了惨绝人寰的大屠杀，30万以上中国平民和战俘惨遭杀害。铭记历史，珍爱和平。"},
 {y:1945,time:"1945",era:"民国",name:"抗日战争胜利",lon:118.80,lat:32.06,cat:"政",desc:"经过十四年艰苦卓绝的浴血奋战，中国人民取得近代以来反抗外敌入侵的第一次完全胜利。"},
 {y:1948,time:"1948—1949",era:"民国",name:"三大战役",lon:117.18,lat:34.26,cat:"战",desc:"辽沈、淮海、平津三大战役基本消灭国民党军队主力，大大加速了解放战争在全国的胜利。"},
 {y:1949,time:"1949",era:"新中国",name:"开国大典",lon:116.40,lat:39.90,cat:"政",desc:"10月1日，毛泽东在天安门城楼宣告中华人民共和国成立，中国历史从此翻开崭新篇章。"}

 {y:-551,time:"约前551",era:"春秋",name:"孔子创立儒学",lon:116.98,lat:35.58,cat:"文",desc:"孔子开创私人讲学之风，主张『仁』与『礼』，晚年整理六经，儒家思想成为此后两千余年中华文明的主干。"},
 {y:-600,time:"约前600",era:"春秋",name:"《诗经》编定",lon:113.26,lat:30.67,cat:"文",desc:"《诗经》收诗三百零五篇，是我国第一部诗歌总集，开创现实主义传统，多记西周至春秋初年的社会面貌。"},
 {y:-475,time:"约前475",era:"战国",name:"百家争鸣",lon:108.71,lat:34.33,cat:"文",desc:"儒道墨法各家并起：墨子兼爱非攻、孟子仁政、庄子逍遥、韩非法术势，是中国思想史上第一个黄金时代。"},
 {y:-512,time:"约前512",era:"春秋",name:"《孙子兵法》成书",lon:120.70,lat:31.35,cat:"文",desc:"孙武所著《孙子兵法》是世界现存最早的军事著作，『知己知彼，百战不殆』『不战而屈人之兵』至今传诵。"},
 {y:-450,time:"约前450",era:"战国",name:"铁器与牛耕推广",lon:112.55,lat:35.48,cat:"工",desc:"铁制农具与牛耕在战国时期推广，生产力飞跃，私田出现、井田制瓦解，土地私有制逐步确立。"},
 {y:-214,time:"前214",era:"秦",name:"开凿灵渠",lon:110.67,lat:25.61,cat:"工",desc:"秦始皇派史禄开凿灵渠，沟通湘江与漓江，把长江水系和珠江水系连接起来，促进了岭南的开发与统一。"},
 {y:-221,time:"前221",era:"秦",name:"书同文 车同轨",lon:108.71,lat:34.33,cat:"文",desc:"秦始皇统一文字为小篆，统一货币、度量衡与车轨，构建了大一统国家共同的文化底座。"},
 {y:73,time:"73",era:"东汉",name:"班超经营西域",lon:108.94,lat:34.27,cat:"交",rt:[[108.94,34.27],[103.83,36.06],[94.66,40.14],[89.18,42.95],[76.0,39.47]],desc:"班超投笔从戎，出使西域三十一年，重开丝绸之路；其副使甘英曾抵达波斯湾，远达西亚。"},
 {y:67,time:"67",era:"东汉",name:"佛教传入中国",lon:112.45,lat:34.62,cat:"交",desc:"汉明帝遣使西行求法，在洛阳建白马寺，佛教自此传入中国，并逐渐与中国文化相融合。"},
 {y:132,time:"132",era:"东汉",name:"张衡与地动仪",lon:112.45,lat:34.62,cat:"工",desc:"张衡创制候风地动仪，可测定地震方位，是世界上最早的地震仪器；他还集浑天说之大成。"},
 {y:100,time:"约100",era:"东汉",name:"《九章算术》成书",lon:112.45,lat:34.62,cat:"工",desc:"《九章算术》系统总结了先秦至西汉的数学成就，奠定中国古代数学以计算为中心的体系，影响东亚千余年。"},
 {y:200,time:"约200",era:"东汉末",name:"华佗与麻沸散",lon:115.90,lat:32.42,cat:"工",desc:"神医华佗创用麻沸散施行外科手术，比西方麻醉剂早一千余年；又编『五禽戏』健身术，被后世尊为外科鼻祖。"},
 {y:460,time:"约460",era:"南北朝",name:"祖冲之与圆周率",lon:118.80,lat:32.06,cat:"工",desc:"祖冲之把圆周率精确到小数点后第七位，这一纪录保持了近千年；他还编制《大明历》，测算回归年误差极小。"},
 {y:353,time:"353",era:"东晋",name:"王羲之《兰亭集序》",lon:120.58,lat:29.99,cat:"文",desc:"王羲之在会稽兰亭雅集时写下《兰亭集序》，被誉为『天下第一行书』，其书法开一代新风，人称『书圣』。"},
 {y:540,time:"约540",era:"北魏",name:"贾思勰《齐民要术》",lon:118.48,lat:36.68,cat:"工",desc:"贾思勰所著《齐民要术》是我国现存最早最完整的综合性农书，系统总结了北方农牧生产技术与经验。"},
 {y:460,time:"约460起",era:"北魏",name:"石窟艺术开凿",lon:113.30,lat:40.08,cat:"文",desc:"北魏开凿云冈石窟，随后龙门石窟、敦煌莫高窟相继营建，佛教艺术与中华传统相融合，成为世界艺术瑰宝。"},
 {y:400,time:"约400",era:"东晋",name:"江南经济开发",lon:118.80,lat:32.06,cat:"政",desc:"西晋末年以来北方人口大量南迁，带来先进工具与技术，江南地区得到开发，为日后经济重心南移奠定基础。"},
 {y:610,time:"约610",era:"隋",name:"赵州桥建成",lon:114.78,lat:37.75,cat:"工",desc:"工匠李春设计建造的赵州桥是世界上现存最古老的敞肩石拱桥，历经一千四百余年仍巍然屹立。"},
 {y:868,time:"868",era:"唐",name:"雕版印刷《金刚经》",lon:108.94,lat:34.27,cat:"工",desc:"868年印成的《金刚经》卷子是世界现存最早有确切纪年的雕版印刷品，字画精美，藏于英国大英博物馆。"},
 {y:850,time:"约850",era:"唐",name:"火药发明",lon:108.94,lat:34.27,cat:"工",desc:"唐代炼丹家在炼制丹药时偶然发现火药配方，后用于军事；火药的西传深刻改变了世界历史的进程。"},
 {y:700,time:"约700",era:"唐",name:"唐诗兴盛",lon:108.94,lat:34.27,cat:"文",desc:"李白豪放飘逸、杜甫沉郁顿挫、白居易平易近人……唐诗是中国古典诗歌不可逾越的高峰，名篇千古传诵。"},
 {y:652,time:"652",era:"唐",name:"孙思邈与《千金方》",lon:108.94,lat:34.27,cat:"工",desc:"『药王』孙思邈著《千金要方》《千金翼方》，收方六千余首，提出『大医精诚』，奠定中医医德传统。"},
 {y:630,time:"630起",era:"唐",name:"遣唐使来华",lon:108.94,lat:34.27,cat:"交",rt:[[108.94,34.27],[119.42,32.39],[127.7,26.3],[135.8,34.68]],desc:"日本先后十多次派遣唐使，全面学习唐朝制度、文字与佛法；阿倍仲麻吕留唐为官、鉴真东渡传法，是盛唐开放的见证。"},
 {y:713,time:"713—741",era:"唐",name:"开元盛世",lon:108.94,lat:34.27,cat:"政",desc:"唐玄宗前期任用姚崇、宋璟等贤相，励精图治，人口增长、府库充盈，长安成为万国来朝的国际化大都市。"},
 {y:1119,time:"约1119",era:"北宋",name:"指南针用于航海",lon:118.58,lat:24.91,cat:"工",desc:"北宋时指南针已用于航海，南宋时商船广泛装备；传入欧洲后推动了大航海时代的到来。"},
 {y:1000,time:"约1000",era:"北宋",name:"火药武器用于军事",lon:114.30,lat:34.80,cat:"工",desc:"北宋在汴京设作坊大量制造火药箭、火球等火器，开创冷热兵器并用时代，火器随战争进一步传播。"},
 {y:1050,time:"约1050",era:"北宋",name:"宋词兴盛",lon:114.30,lat:34.80,cat:"文",desc:"柳永慢词婉约、苏轼『大江东去』豪放，李清照、辛弃疾各领风骚，词在宋代达到全盛，与唐诗并称双绝。"},
 {y:1084,time:"1084",era:"北宋",name:"《资治通鉴》成书",lon:114.30,lat:34.80,cat:"文",desc:"司马光主持编纂的编年体通史，上起战国下至五代，『鉴于往事，有资于治道』，是帝王与读书人必读之书。"},
 {y:1088,time:"约1088",era:"北宋",name:"《梦溪笔谈》",lon:114.30,lat:34.80,cat:"工",desc:"沈括在《梦溪笔谈》中记载指南针、活字印刷等当时最新科技，被誉为『中国科学史上的里程碑』。"},
 {y:1023,time:"约1023",era:"北宋",name:"交子出现",lon:104.06,lat:30.67,cat:"政",desc:"益州（今成都）商民发行世界上最早的纸币交子，反映宋代商品经济的高度繁荣，比欧洲纸币早六百余年。"},
 {y:1111,time:"约1111",era:"北宋",name:"《清明上河图》",lon:114.30,lat:34.80,cat:"文",desc:"张择端以五米长卷再现汴京都市风貌，五百余人物、舟车市肆历历在目，是研究宋代城市与经济的珍贵图像史料。"},
 {y:1175,time:"约1175",era:"南宋",name:"程朱理学形成",lon:117.98,lat:28.95,cat:"文",desc:"朱熹集理学之大成，著《四书章句集注》，主张『格物致知』，此后成为元明清三代官方哲学近七百年。"},
 {y:1200,time:"约1200",era:"南宋",name:"经济重心南移完成",lon:120.70,lat:31.35,cat:"政",desc:"两宋时期南方经济全面超越北方，『苏湖熟，天下足』，全国经济重心南移至此完成。"},
 {y:1300,time:"约1300",era:"元",name:"元曲与杂剧兴盛",lon:116.40,lat:39.90,cat:"文",desc:"关汉卿《窦娥冤》、王实甫《西厢记》、马致远《天净沙·秋思》，元曲与唐诗宋词并称，是中国戏曲的第一个高峰。"},
 {y:1281,time:"1281",era:"元",name:"郭守敬《授时历》",lon:116.40,lat:39.90,cat:"工",desc:"郭守敬编制《授时历》，测定回归年长度为365.2425日，与现行公历一致，却比格里高利历早了三百余年。"},
 {y:1320,time:"约1320",era:"元",name:"景德镇青花瓷成熟",lon:117.18,lat:29.27,cat:"工",desc:"元代青花瓷烧造成熟，白釉蓝花、色泽典雅，景德镇由此成为『瓷都』，青花瓷远销西亚与欧洲。"},
 {y:1275,time:"1275",era:"元",name:"马可·波罗来华",lon:116.40,lat:39.90,cat:"交",desc:"据《马可·波罗行纪》记载，意大利旅行家马可·波罗随商旅来华，在元朝游历多年，其游记让欧洲第一次较全面认识东方。"},
 {y:1400,time:"约1400",era:"明",name:"明长城大规模修筑",lon:116.40,lat:39.90,cat:"工",desc:"明朝在历代长城基础上大规模营建，东起鸭绿江、西至嘉峪关，全长逾两万里，是世界古代防御工程的奇迹。"},
 {y:1578,time:"1578",era:"明",name:"李时珍《本草纲目》",lon:115.44,lat:30.23,cat:"工",desc:"李时珍历时二十七年编成《本草纲目》，收药一千八百余种、附图一千余幅，被誉为『东方医药巨典』。"},
 {y:1582,time:"1582",era:"明",name:"利玛窦来华 · 西学东渐",lon:116.40,lat:39.90,cat:"交",desc:"意大利传教士利玛窦来华，与徐光启合译《几何原本》，传入西方天文历算，也把中国文化介绍给欧洲。"},
 {y:1550,time:"约16世纪",era:"明",name:"《三国》《水浒》《西游》成书",lon:114.30,lat:34.80,cat:"文",desc:"《三国演义》《水浒传》《西游记》成书于明代，是中国古典小说的巅峰；清代另有《红楼梦》问世。"},
 {y:1637,time:"1637",era:"明",name:"宋应星《天工开物》",lon:115.37,lat:28.70,cat:"工",desc:"《天工开物》系统总结明代农工业生产技术，『贵五谷而贱金玉』，被誉为『中国17世纪的工艺百科全书』。"},
 {y:1639,time:"1639",era:"明",name:"徐光启《农政全书》",lon:121.47,lat:31.23,cat:"工",desc:"徐光启在《农政全书》中总结历代农学并吸收西方水利知识，是农业百科全书式的巨著，也是农学集大成之作。"},
 {y:1763,time:"约1763",era:"清",name:"《红楼梦》问世",lon:116.40,lat:39.90,cat:"文",desc:"曹雪芹『披阅十载，增删五次』写成《红楼梦》，以贾府兴衰写尽世态人情，被誉为中国封建社会的百科全书。"},
 {y:1782,time:"1782",era:"清",name:"《四库全书》编纂",lon:116.40,lat:39.90,cat:"文",desc:"乾隆年间编纂的《四库全书》收录典籍三千四百余种、近八万卷，是我国古代最大的一部丛书；毁誉参半，既存书亦毁书。"},
 {y:1790,time:"1790",era:"清",name:"京剧形成",lon:116.40,lat:39.90,cat:"文",desc:"徽班进京后徽汉合流，兼容昆曲秦腔，京剧在北京形成并成为国粹，被誉为『东方歌剧』，享誉世界。"},
 {y:1757,time:"1757",era:"清",name:"闭关锁国政策",lon:113.67,lat:23.13,cat:"政",desc:"清政府只留广州一口通商，严格限制对外贸易与交往，使中国与世界隔绝，逐渐落后于世界潮流。"},

  cul:"孔子创立儒学、老子创立道家；《诗经》《孙子兵法》成书；私学兴起，士阶层登上历史舞台。",
  turn:"平王东迁开启春秋；『三家分晋』『田氏代齐』标志卿大夫夺权完成，周王室名存实亡，春秋结束、战国开始。"},
 {id:"zhanguo",name:"战国",y:"前475—前221",c:"3bb8c4",era:["战国"],
  intro:"七雄并立，变法图强成为时代主题，商鞅变法使秦崛起。百家争鸣达到顶峰，儒、墨、道、法各家争鸣，为中国思想文化奠定了基本格局。",
  pol:"七雄并立，变法图强：李悝魏国变法、吴起楚国变法、商鞅秦国变法；郡县制逐步推行，官僚政治取代贵族政治。",
  eco:"铁器牛耕普及，个体小农经济确立；都江堰、郑国渠等大型水利兴建；货币（刀布圜钱）与度量衡渐趋统一。",
  cul:"百家争鸣达于极盛：儒（孟荀）、道（庄周）、墨、法（韩非）、兵、纵横诸家并出；屈原作《离骚》，楚辞成体。",
  turn:"秦经商鞅变法后国力最强；前230至前221年依次灭韩、赵、魏、楚、燕、齐六国，『六王毕，四海一』，秦统一中国。"},
 {id:"qin",name:"秦",y:"前221—前207",c:"e0483b",era:["秦","秦末"],
  intro:"中国历史上第一个统一的多民族中央集权王朝。秦始皇推行郡县制、统一文字货币度量衡，北筑长城南修灵渠，功业彪炳；然严刑峻法、徭役繁重，二世而亡。",
  pol:"首创皇帝制度与三公九卿制，全面推行郡县制；书同文、车同轨、统一度量衡；严刑峻法，以法为教、以吏为师。",
  eco:"统一货币（半两钱）与度量衡，驰道、直道、灵渠等交通水利工程大兴；赋税徭役繁重，民不堪命。",
  cul:"以小篆统一文字；焚书坑儒禁锢思想；兵马俑、长城、阿房宫展现宏大工程技术与艺术成就。",
  turn:"嬴政并六国称始皇帝；二世胡亥昏暴，陈胜吴广首义，刘邦项羽并起；前207年秦亡，『其兴也勃焉，其亡也忽焉』。"},
 {id:"xin",name:"新",y:"8—23",c:"9e9e9e",era:["新"],
  intro:"王莽代汉建立的短命王朝，仅存十五年。托古改制、复古周礼，却因政策混乱与天灾频仍而迅速崩溃，在绿林赤眉起义中灭亡。",
  pol:"王莽托古改制：改官制、行王田、禁奴婢、行五均六筦，意图复古周礼，结果政策混乱、法令苛繁，上下其手。",
  eco:"王田制触动豪强地主利益，五均六筦垄断工商；币制屡次变更，物价飞涨，经济秩序大乱，民不聊生。",
  cul:"崇儒复古、迷信谶纬，古文经学一度立于学官；但改制空想色彩浓厚，未能解决任何现实矛盾。",
  turn:"外戚王莽代汉称帝，国号『新』；改制失败加天灾频仍，绿林赤眉起义爆发；23年昆阳之战刘秀大破新军，绿林军攻入长安，新朝灭亡。"},
 {id:"xihan",name:"西汉",y:"前202—公元8",c:"e6a83b",era:["西汉"],
  intro:"刘邦建立，定都长安。文景之治休养生息，武帝时期北击匈奴、开通丝路、独尊儒术，国力臻于鼎盛；晚期外戚专权，为王莽所篡。",
  pol:"汉承秦制而损益：郡国并行，武帝推恩令削藩；设内外朝、刺史制度强化皇权；独尊儒术，确立思想正统。",
  eco:"休养生息，文景之治轻徭薄赋；盐铁官营、均输平准充实国库；丝绸之路开通，中外贸易渐盛。",
  cul:"儒学成为正统，太学建立；司马迁著《史记》，司马相如赋与乐府诗兴起；张骞凿空西域，中西文化交汇。",
  turn:"刘邦楚汉争霸胜项羽建汉；吕后专权后文景继之；武帝拓疆至鼎盛；后期外戚王氏掌权，公元8年王莽篡汉，西汉亡。"},
 {id:"donghan",name:"东汉",y:"25—220",c:"d8b866",era:["东汉"],
  intro:"刘秀光武中兴，定都洛阳。明章之治后戚宦之争加剧，党锢之祸与黄巾起义动摇根基，豪强割据，最终分裂为三国。",
  pol:"光武中兴强化尚书台、削弱三公实权；外戚宦官交替专权，党锢之祸打击士人；豪强地主势力膨胀。",
  eco:"豪强田庄自给自足、精耕细作；蔡伦改进造纸术，冶铁使用水排鼓风；人口增长，北方经济恢复发展。",
  cul:"佛教传入、道教创立；班固《汉书》、许慎《说文解字》、张衡地动仪；隶书成熟，书法艺术兴起。",
  turn:"刘秀昆阳之战成名，重建汉室；明章之治后戚宦相争，黄巾起义动摇根基；董卓乱政、军阀割据，220年曹丕代汉，东汉亡。"},
 {id:"sanguo",name:"三国",y:"220—280",c:"e0483b",era:["三国","东汉末"],
  intro:"魏、蜀、吴三足鼎立。曹操统一北方、刘备据益州、孙权守江东，赤壁之战奠定格局。三国时期人才辈出，为后世留下了最精彩的历史演义。",
  pol:"三国鼎立、各自建制：曹魏九品中正制与屯田、蜀汉依法治国、东吴世袭领兵制；诸葛亮北伐、司马懿专权。",
  eco:"魏国屯田制恢复北方生产；蜀汉都江堰兴农、蜀锦外销；东吴开发江南，造船业与航海发达，派船队至夷洲。",
  cul:"建安文学（三曹七子）慷慨悲凉；玄学兴起；华佗医术、马钧机械；三国人物故事成为后世演义与戏曲的宝库。",
  turn:"董卓之乱后群雄逐鹿，曹操统一北方；208年赤壁之战奠定三分；220年曹丕代汉，221年刘备称帝，229年孙权称帝；263年魏灭蜀，265年司马炎代魏建晋，280年晋灭吴，天下复归统一。"},
 {id:"xijin",name:"西晋",y:"266—316",c:"56c46a",era:["西晋"],
  intro:"司马炎代魏建晋，统一三国。但八王之乱耗尽国力，五胡乱华导致中原动荡，仅五十余年便南渡偏安，是中国历史上短暂而动荡的统一王朝。",
  pol:"门阀士族政治确立，九品中正制维护世家大族；八王之乱宗室自相残杀，中央权威扫地；五胡内迁矛盾激化。",
  eco:"占田课田制颁布，均田制雏形；门阀庄园经济膨胀；太康年间短暂繁荣，『天下书同文，车同轨』。",
  cul:"太康文学（陆机、潘岳）辞采繁富；向秀、郭象玄学盛行；竹林七贤名士风流；佛教进一步传播。",
  turn:"司马懿高平陵之变夺权，司马昭灭蜀，265年司马炎代魏建晋；280年灭吴统一；291年八王之乱，316年匈奴攻破长安，西晋亡，晋室南渡。"},
 {id:"dongjin",name:"东晋",y:"317—420",c:"9ecbff",era:["东晋"],
  intro:"司马睿在建康（今南京）建立，与北方十六国对峙。淝水之战以少胜多击退前秦，门阀政治与玄学清谈盛行，王羲之、陶渊明等名家辈出。",
  pol:"门阀政治鼎盛，『王与马，共天下』；士族垄断清要，寒门难进；北府兵等流民武装逐步崛起。",
  eco:"北方士民南迁带来劳力与技术，江南经济大开发；士族庄园经济为主，建康成为南方最大都市。",
  cul:"王羲之『书圣』、顾恺之绘画、陶渊明田园诗；玄学清谈与佛教般若学合流；兰亭雅集传为千古佳话。",
  turn:"317年司马睿建康称帝，与北方十六国对峙；383年淝水之战谢玄大破前秦；后期桓玄篡位、刘裕崛起，420年刘裕代晋建宋，东晋亡。"},
 {id:"nanbei",name:"南北朝",y:"420—589",c:"b57ce0",era:["南北朝","北魏"],
  intro:"南朝宋齐梁陈与北朝北魏、东魏、西魏、北齐、北周并立。孝文帝迁都洛阳推行汉化，民族大融合加速；南北方经济文化各自发展，为隋唐统一积蓄力量。",
  pol:"南朝门阀政治渐衰、皇权回升；北朝北魏孝文帝汉化改革，均田制与三长制确立，民族大融合深入。",
  eco:"江南开发加速，经济重心南移趋势明显；北方均田制恢复生产；洛阳、建康为南北两大都会，商路畅通。",
  cul:"孝文帝迁都洛阳推行汉化；云冈、龙门石窟艺术灿烂；祖冲之圆周率、贾思勰《齐民要术》、郦道元《水经注》问世。",
  turn:"420年刘裕代晋建宋，此后萧道成代宋建齐（479）、萧衍代齐建梁（502）、陈霸先代梁建陈（557），南朝四代更迭；北朝439年北魏统一北方，534年分裂为东魏西魏，东魏550年为北齐所代、西魏557年为北周所代，577年北周灭北齐；581年杨坚代周建隋，589年隋灭陈，南北朝结束。",
  flow:"南朝更迭：宋（刘裕）→ 齐（萧道成）→ 梁（萧衍）→ 陈（陈霸先），皆为权臣禅代；北朝更迭：北魏统一北方 → 534年分裂为东魏（高欢掌权）与西魏（宇文泰掌权）→ 东魏550年被北齐取代（高洋）、西魏557年被北周取代（宇文觉）→ 577年北周灭北齐 → 581年杨坚代北周建隋 → 589年隋灭陈，天下重归统一。"},
 {id:"sui",name:"隋",y:"581—618",c:"3bb8c4",era:["隋"],
  intro:"杨坚代周建隋，589年灭陈统一南北。开皇之治仓廪充实，开凿大运河、开创科举制，功在千秋；然炀帝役民过甚，隋朝二世而亡，为唐所代。",
  pol:"三省六部制确立，科举制开创，中央集权强化；均田制与租庸调制推行；废九品中正，寒门得以入仕。",
  eco:"开皇之治府库充盈，积粟可供五六十年；大运河贯通南北，商业都会兴起；造船、纺织技术先进。",
  cul:"科举取士取代门阀垄断；佛教极盛，天台宗创立；书法（智永）、音乐（燕乐源头）等艺术繁荣。",
  turn:"581年杨坚代北周建隋，589年灭陈统一南北；炀帝三次征高丽、滥用民力，起义烽火遍地；618年宇文化及弑炀帝，李渊太原起兵建唐，隋亡。"},
 {id:"tang",name:"唐",y:"618—907",c:"e6a83b",era:["唐"],
  intro:"中国封建社会的鼎盛王朝。贞观之治、开元盛世，长安城万国来朝；安史之乱后藩镇割据、宦官专权，终致灭亡。唐诗与开放气象，是中华文明的高峰。",
  pol:"三省六部制完善，政事堂合议；科举制全面推行，进士科最重；安史之乱后藩镇割据、宦官专权、牛李党争。",
  eco:"均田制、租庸调制保障财政；曲辕犁、筒车提高农业；长安、洛阳、扬州商业繁荣，邸店柜坊出现，夜市兴起。",
  cul:"唐诗登峰造极（李白杜甫白居易）；书法颜柳欧、绘画吴道子；佛教八宗并立；中外文化交流空前（遣唐使、玄奘鉴真）。",
  turn:"李渊太原起兵建唐，玄武门之变李世民即位；贞观之治、开元盛世至鼎盛；755年安史之乱由盛转衰；黄巢起义沉重打击；907年朱温废哀帝建后梁，唐亡。"},
 {id:"wudai",name:"五代十国",y:"907—960",c:"9e9e9e",era:["五代"],
  intro:"唐亡后中原更迭梁、唐、晋、汉、周五代，南方诸国并立。政权频繁更替，但南方经济持续发展，为宋代的统一与经济重心南移奠定基础。",
  pol:"五代（梁唐晋汉周）更迭中原、武人当政，政权短促；十国割据南方；后周世宗改革为统一奠定基础。",
  eco:"南方十国相对安定，农业手工业持续发展；吴越修海塘、南唐兴商贸；经济重心南移加速。",
  cul:"词体发展（南唐二主、冯延巳）；印刷业兴盛，冯道主持刊刻九经；禅宗南宗盛行，文人画萌芽。",
  turn:"907年朱温代唐建后梁；后唐（923）、后晋（936，石敬瑭割燕云十六州）、后汉（947）、后周（951）相继；960年赵匡胤陈桥兵变建宋，『先南后北』统一中原与南方，五代十国终结。"},
 {id:"beisong",name:"北宋",y:"960—1127",c:"56c46a",era:["北宋","北宋末","两宋"],
  intro:"赵匡胤陈桥兵变建立，重文轻武、完善科举。商品经济繁荣，活字印刷与交子出现，城市生活丰富；然积贫积弱，靖康之变中灭亡。",
  pol:"重文轻武，杯酒释兵权；二府三司制分割相权，设枢密院掌军政；王安石变法力图富国强兵，新旧党争不断。",
  eco:"商品经济高度繁荣，交子出现，坊市制度打破；造船、制瓷（五大名窑）、纺织业发达；海外贸易兴盛。",
  cul:"程朱理学形成；苏轼欧阳修诗文革新；《资治通鉴》《梦溪笔谈》《清明上河图》传世；活字印刷发明。",
  turn:"960年陈桥兵变代周建宋；太宗统一南北；澶渊之盟后以岁币买和；王安石变法未竟；1125年金灭辽后南下，1127年靖康之变徽钦二帝被掳，北宋亡。"},
 {id:"nansong",name:"南宋",y:"1127—1279",c:"3bb8c4",era:["南宋"],
  intro:"赵构南渡建都临安，与金、蒙先后对峙。经济文化高度繁荣，海上丝路兴盛；岳飞抗金、文天祥守节，最终在崖山海战中覆亡。",
  pol:"偏安江南，与金、蒙先后对峙；中央集权强化，但主战主和之争贯穿始终，秦桧、韩侂胄、贾似道相继专权。",
  eco:"经济重心南移完成，『苏湖熟，天下足』；海外贸易鼎盛，泉州为东方第一大港；市舶司税收成为重要财源。",
  cul:"宋词极盛（辛弃疾、李清照、陆游）；朱熹理学集大成；书院林立（岳麓、白鹿洞）；马远夏圭『残山剩水』画风。",
  turn:"1127年赵构南京即位，南渡临安；绍兴和议后偏安；岳飞抗金被十二道金牌召回；1234年联蒙灭金；1276年临安陷落，1279年崖山海战陆秀夫负帝蹈海，南宋亡。"},
 {id:"yuan",name:"元",y:"1271—1368",c:"c9944f",era:["元","蒙古"],
  intro:"蒙古帝国分裂后由忽必烈建立，定都大都。行省制度开后世之先，疆域空前辽阔；民族政策与治理矛盾并存，不足百年为明所代。",
  pol:"行省制度确立，中书省总理政务；宣政院管理吐蕃，岭北、辽阳行省管辖边疆；四等人制造成民族矛盾。",
  eco:"纸币中统钞通行；大运河截弯取直，海运漕粮；棉纺织（黄道婆）、青花瓷（景德镇）发展；泉州、广州海外贸易繁盛。",
  cul:"元曲杂剧鼎盛（关汉卿、王实甫、马致远）；郭守敬《授时历》领先世界；赵孟頫书画、文人画兴起。",
  turn:"1206年成吉思汗建蒙古国，1271年忽必烈定国号元；1276年破临安、1279年灭南宋统一全国；红巾军起义，1368年朱元璋攻入大都，元顺帝北遁，元亡（北元延续至1402年）。"},
 {id:"ming",name:"明",y:"1368—1644",c:"e0483b",era:["明","明末"],
  intro:"朱元璋建立，定都南京后迁北京。废丞相、设内阁与厂卫，郑和七下西洋，商品经济与市民文化繁荣；后期宦官专权、党争加剧，李自成攻入北京而亡。",
  pol:"废丞相设内阁，厂卫特务机构强化皇权；八股取士禁锢思想；张居正改革一度中兴；后期宦官专权、党争激烈。",
  eco:"明初休养生息，一条鞭法赋役合一；江南手工业发达，资本主义萌芽出现；白银货币化，海外贸易繁荣。",
  cul:"阳明心学兴起；《永乐大典》《本草纲目》《天工开物》《农政全书》；四大名著中三部成书于明代；园林戏曲繁荣。",
  turn:"1368年朱元璋建明，北伐灭元；靖难之役成祖迁都北京；1449年土木堡之变；1644年李自成破北京，崇祯自缢，明亡；随后清兵入关。"},
 {id:"qing",name:"清",y:"1644—1912",c:"e6a83b",era:["清","清初","明清","晚清"],
  intro:"中国最后一个封建王朝。康乾盛世疆域辽阔，奠定现代中国版图；闭关锁国与鸦片战争后国门洞开，洋务、戊戌、辛亥等救亡图存运动相继兴起，1912年灭亡。",
  pol:"君主专制空前强化，军机处为中枢；康雍乾三朝奠定版图；闭关锁国；鸦片战争后被迫开放，洋务、戊戌、清末新政相继。",
  eco:"康乾盛世人口破三亿；江南丝织棉纺、景德镇制瓷发达；鸦片战争后自然经济逐步解体，近代工商业兴起。",
  cul:"《四库全书》编纂；乾嘉考据学兴盛；京剧形成；西学东渐与经世致用思潮并起。",
  turn:"1644年清军入关，逐步统一全国；平定三藩之乱、收复台湾后疆域稳固；1840年鸦片战争后国势日衰；1911年辛亥革命爆发，1912年宣统退位，清亡。"},
 {id:"minguo",name:"民国",y:"1912—1949",c:"9ecbff",era:["民国","清末"],
  intro:"1912年中华民国成立，结束两千多年帝制。军阀混战、北伐统一、抗日战争与解放战争相继上演，是中华民族从屈辱走向新生的过渡时期。",
  pol:"共和体制初创；袁世凯窃国复辟失败；军阀混战、北伐统一、训政宪政更替；抗日战争国共合作，解放战争改朝换代。",
  eco:"民族资本主义曲折发展（一战『短暂春天』）；口岸城市近代工商业兴起；农村经济凋敝，南北差异明显。",
  cul:"新文化运动高举民主科学，白话文普及；马克思主义传播；近代教育、出版、电影等新文化形态兴起。",
  turn:"1911年辛亥革命推翻帝制；1912年民国建立；军阀混战后北伐统一；1937—1945年全民族抗战胜利；1946—1949年解放战争，1949年中华人民共和国成立，民国时期结束。"},
 {id:"xinzhongguo",name:"新中国",y:"1949—今",c:"ff8a65",era:["新中国"],
  intro:"1949年中华人民共和国成立，中国人民从此站起来了。社会主义建设与改革开放，使中国走向繁荣富强的新时代。",
  pol:"1949年中华人民共和国成立，人民民主专政；社会主义制度确立；改革开放后中国特色社会主义道路开辟。",
  eco:"国民经济恢复，一五计划奠定工业化基础；改革开放后经济腾飞，全面建成小康社会。",
  cul:"『两弹一星』、杂交水稻等科技成就；文化教育普及，中国故事走向世界。",
  turn:"1949年10月1日开国大典，中国人民站起来，中国历史翻开新纪元。"}

 {id:"qinshihuang",name:"秦始皇嬴政",period:"前259—前210",title:"秦朝开国皇帝",
  intro:"十三岁即位，二十二岁亲政，用十年灭六国完成统一，建立中国历史上第一个统一的多民族中央集权国家。他推行郡县制，统一文字、货币、度量衡与车轨，北筑长城、南修灵渠，书同文、车同轨、行同伦，奠定此后两千余年中华大一统的基本格局。",
  stories:[
   {t:"图穷匕见 · 荆轲刺秦",d:"燕太子丹派荆轲携樊於期首级与督亢地图入秦，荆轲在地图展尽时抽出匕首刺向秦王，秦王绕柱而走，最终荆轲被卫士所杀。易水送别时「风萧萧兮易水寒，壮士一去兮不复还」，成为千古悲歌。"},
   {t:"书同文 · 车同轨",d:"统一后，秦始皇命李斯以小篆为标准统一六国文字，又规定车轨宽六尺，修驰道、直道连通全国，并统一货币（半两钱）与度量衡。这些制度使各地经济文化紧密相连，是「大一统」的真正落地。"},
   {t:"修筑万里长城",d:"为抵御北方匈奴，秦始皇连接战国旧长城并新建，西起临洮东至辽东，动用数十万民夫。民间流传「孟姜女哭长城」的传说：孟姜女寻夫哭倒长城，成为暴政与征役的永恒控诉。"},
   {t:"焚书坑儒",d:"丞相李斯建议除《秦纪》及医药、卜筮、种树之书外，将民间所藏诗书百家语一律焚毁；后来又在咸阳坑杀四百六十余名方士儒生。此举摧残文化，是秦始皇专制统治最受争议的一笔。"},
   {t:"泰山封禅与徐福东渡",d:"秦始皇五次巡游天下，登泰山封禅立石颂德；又听方士之言，派徐福率童男童女入海求仙药。徐福一去不返，相传东渡日本，成为中日交流的传奇。"},
   {t:"沙丘之变 · 二世而亡",d:"前210年，秦始皇东巡途中病逝于沙丘。赵高与李斯合谋篡改遗诏，赐死公子扶苏，立胡亥为二世。秦法严苛、徭役繁重，不久陈胜吴广揭竿而起，秦朝二世而亡，仅存十五年。"}

 {id:"liubang",name:"汉高祖刘邦",period:"前256—前195",title:"西汉开国皇帝",
  intro:"出身沛县农家，曾任泗水亭长，秦末天下大乱时起兵反秦，先入关中。楚汉之争历时四年击败项羽，前202年称帝建立汉朝，定都长安。他约法三章、与民休息，轻徭薄赋，奠定汉家四百年基业。",
  stories:[
   {t:"斩白蛇起义",d:"刘邦任亭长时押送刑徒赴骊山，途中放走众人，自己隐匿芒砀山。相传路遇大蛇拦路，他拔剑斩之，后有老妪哭诉白帝之子被杀，于是「赤帝子斩白帝子」的传说流传开来，聚拢了第一批追随者。"},
   {t:"约法三章",d:"前206年刘邦先入关中，进驻咸阳，宣布废除秦朝苛法，只与百姓约法三章：「杀人者死，伤人及盗抵罪」。关中父老欢欣鼓舞，秦人争送酒食，这为他赢得民心、最终夺取天下打下基础。"},
   {t:"鸿门宴",d:"项羽闻刘邦先入关中，设鸿门宴欲除之。席间项庄舞剑意在沛公，项伯以身翼护；张良召樊哙闯入，刘邦借如厕之机从小路逃走。这场宴会是楚汉之争的转折点，留下「项庄舞剑，意在沛公」的成语。"},
   {t:"汉初三杰",d:"刘邦称帝后总结取胜之道：运筹帷幄之中、决胜千里之外，吾不如张良；镇国家、抚百姓、给馈饷，吾不如萧何；连百万之军、战必胜攻必取，吾不如韩信。三者皆人杰，吾能用之，所以取天下。这成为用人之道的千古名论。"},
   {t:"垓下之围与霸王别姬",d:"前202年，韩信十面埋伏将项羽围于垓下。四面楚歌中，项羽与虞姬诀别后突围至乌江，自觉无颜见江东父老，自刎而死。刘邦由此一统天下，建立了延续四百年的汉朝。"},
   {t:"大风歌",d:"晚年刘邦平定英布叛乱后路过故乡沛县，召故人饮酒，击筑而歌：「大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方。」既抒豪情，也道出对守成人才的深切忧虑。"}

 {id:"hanwudi",name:"汉武帝刘彻",period:"前156—前87",title:"西汉皇帝",
  intro:"十六岁即位，在位五十四年。对内颁推恩令削诸侯、独尊儒术、设太学，将盐铁收归官营；对外北击匈奴、通西域、平南越，使西汉疆域空前辽阔。他「秦皇汉武」并称，晚年下轮台诏反省征伐，与民休息。",
  stories:[
   {t:"金屋藏娇",d:"相传武帝年幼时，馆陶长公主抱他在膝上问想娶谁为妻，他说：「若得阿娇作妇，当作金屋贮之。」后来他果然立表姐陈阿娇为皇后。成语「金屋藏娇」由此而来，也埋下后来「长门怨」的宫廷悲欢。"},
   {t:"推恩令",d:"为削夺诸侯王势力，主父偃献计：让诸侯王把封地分封给所有子弟。封地越分越小，诸侯再也无力与中央抗衡，不动刀兵便化解了汉初「七国之乱」式的隐患，中央集权空前加强。"},
   {t:"独尊儒术",d:"董仲舒上《天人三策》，建议「罢黜百家，独尊儒术」。武帝设五经博士、兴办太学，儒学由此成为此后两千年官方正统思想，深刻塑造了中国人的价值观与国家治理模式。"},
   {t:"卫霍北击匈奴",d:"武帝重用卫青、霍去病，多次大举北伐。卫青七战七捷，霍去病「封狼居胥」，将匈奴逐出漠南，夺回河西走廊，彻底扭转了汉匈攻守之势。霍去病「匈奴未灭，何以家为」至今激励后人。"},
   {t:"汗血宝马",d:"为获取大宛良马「汗血宝马」，武帝派李广利两次远征大宛。围绕骏马的战争背后，是对马匹战略资源与丝绸之路通道的争夺，也显示了汉武帝开疆拓土的雄心和代价。"},
   {t:"轮台罪己诏",d:"晚年连年征战、国库空虚、民生凋敝。前89年，武帝下《轮台诏》深自悔过，罢免苛政、重视农桑、与民休息，为「昭宣中兴」奠定基础。帝王公开自我批评，在历史上极为罕见。"}
  ],

 {id:"zhangqian",name:"张骞",period:"约前164—前114",title:"西汉外交家",
  intro:"奉汉武帝之命两次出使西域。第一次为联络大月氏夹击匈奴，途中被匈奴扣留十三年仍持汉节不失；第二次出使乌孙并派副使遍访中亚诸国。他「凿空」西域，开辟了绵延两千年的丝绸之路，被封博望侯。",
  stories:[
   {t:"持节不失",d:"前138年张骞率百余人出陇西，刚出汉境便被匈奴俘虏，扣留十余年，匈奴甚至给他娶妻生子。他始终珍藏汉朝符节，趁匈奴内乱携部属逃出，继续西行完成使命——忠贞不渝是后世对他最高的评价。"},
   {t:"凿空西域",d:"张骞抵达大月氏时，月氏已西迁安居乐业，无意东返复仇，但他的所见所闻让汉朝第一次真切了解西域。司马迁称他此举为「凿空」，意为开辟了前所未有的通道，从此中原与西域正式联通。"},
   {t:"再通西域 · 乌孙结盟",d:"前119年张骞第二次出使，率三百人、携带大量财物抵达乌孙，并派副使分赴大宛、康居、大夏等国。此后西域诸国纷纷与汉朝往来，丝绸之路全面贯通，「使者相望于道，一辈多者数百人」。"},
   {t:"博望侯与丝路驼铃",d:"张骞被封博望侯，「博望」成为汉朝在西域的诚信招牌。他带回的葡萄、苜蓿、石榴等物种在中原生根，而丝绸、漆器、冶铁技术西传，丝绸之路从此驼铃不绝，成为东西方文明交流的大动脉。"}

 {id:"simaqian",name:"司马迁",period:"约前145—？",title:"史学家",
  intro:"太史公司马谈之子，继承父志著史。因李陵之祸遭受宫刑，忍辱负重发愤著书十余年，完成中国第一部纪传体通史《史记》，上起黄帝、下至汉武帝，凡一百三十篇。鲁迅称其「史家之绝唱，无韵之离骚」。",
  stories:[
   {t:"龙门少年 · 壮游天下",d:"司马迁生于夏阳龙门，十岁诵古文，二十岁起游历全国：南游江淮、探禹穴，北涉汶泗、观孔子遗风，足迹遍及大半个中国。实地考察使他笔下的山川人物有了鲜活的生命力。"},
   {t:"李陵之祸",d:"前99年，李陵兵败投降匈奴，满朝皆言其罪，司马迁挺身为其辩护，触怒汉武帝，被处以宫刑。在士大夫视名节如生命的时代，这是奇耻大辱，他一度「肠一日而九回」。"},
   {t:"发愤著书",d:"受刑后司马迁忍辱苟活，只为完成《史记》：「人固有一死，或重于泰山，或轻于鸿毛」。他把屈辱化为动力，以「究天人之际，通古今之变，成一家之言」的气魄，历时约十四年写成这部巨著。"},
   {t:"史家之绝唱",d:"《史记》首创纪传体，以本纪、表、书、世家、列传编织三千年历史；笔端含情，项羽本纪写英雄末路、刺客列传写侠士悲歌，既是史书也是文学经典，被鲁迅誉为「史家之绝唱，无韵之离骚」。"}

 {id:"cailun",name:"蔡伦",period:"61—121",title:"东汉发明家",
  intro:"东汉宦官，任尚方令时掌管宫廷器物制造。他总结前人造纸经验，用树皮、麻头、破布、渔网等廉价原料造出轻薄耐用的纸，天下咸称「蔡侯纸」。造纸术后来传遍世界，被誉为中国古代四大发明之一。",
  stories:[
   {t:"蔡侯纸的诞生",d:"蔡伦改进的造纸法以破布、树皮、麻头、渔网为原料，经过捣浆、抄纸、晾干等工序，成本低、产量高、质地好。前105年他献纸于汉和帝，天下称便，「蔡侯纸」从此取代简帛，书写材料发生革命。"},
   {t:"四大发明之一",d:"造纸术经阿拉伯传入欧洲，取代羊皮纸与莎草纸，极大降低了知识传播的成本。马克思曾说印刷术、火药、指南针是预告资产阶级社会到来的三大发明，而纸正是这一切传播的载体。"}

 {id:"zhugeliang",name:"诸葛亮",period:"181—234",title:"蜀汉丞相",
  intro:"字孔明，号卧龙。刘备三顾茅庐请其出山，提出隆中对三分天下。他辅佐刘备建立蜀汉，白帝城托孤后独撑大局，七擒孟获安定南中，六出祁山北伐曹魏，鞠躬尽瘁，病逝五丈原，是忠智兼备的千古名相。",
  stories:[
   {t:"三顾茅庐 · 隆中对",d:"刘备三顾茅庐，诸葛亮以隆中对相答：先取荆州、益州为家，西和诸戎、南抚夷越，东结孙权、北拒曹操，待天下有变则两路北伐。这篇对策成为蜀汉立国的根本方略，「《隆中对》」也因此传世。"},
   {t:"草船借箭",d:"《三国演义》中，周瑜限诸葛亮十日造十万支箭，孔明趁大雾以草船诱敌，曹操疑有伏兵下令射箭，天明草船满载而归，得箭十万有余。虽是小说家言，却家喻户晓，成为智慧与胆识的象征。"},
   {t:"七擒孟获",d:"南中叛乱，诸葛亮亲征。对南蛮首领孟获「七擒七纵」，最终孟获心悦诚服，表示「南人不复反矣」。攻心为上的策略安定南方，为北伐解除了后顾之忧。"},
   {t:"出师表",d:"北伐前诸葛亮上《出师表》：「先帝创业未半而中道崩殂……鞠躬尽瘁，死而后已。」字字血泪，恳切忠贞。这篇奏表成为忠臣志士的精神丰碑，南宋文天祥、陆游都为之动容。"},
   {t:"木牛流马 · 秋风五丈原",d:"北伐中诸葛亮发明木牛流马运送粮草，革新连弩。234年他病逝于五丈原军中，临终仍安排退军部署。杜甫叹「出师未捷身先死，长使英雄泪满襟」，成为千古遗憾。"}

 {id:"wangxizhi",name:"王羲之",period:"303—361",title:"东晋书法家",
  intro:"东晋名士，出身琅琊王氏。其书法兼善隶、草、楷、行，博采众长、自成一家，《兰亭集序》被誉为「天下第一行书」。他奠定了中国书法艺术的高峰，被后世尊为「书圣」。",
  stories:[
   {t:"东床快婿",d:"太傅郗鉴派人到王家选婿，子弟们纷纷整饰以待，唯有王羲之坦腹东床、若无其事地吃东西。使者回报，郗鉴大喜：「正此佳婿邪！」遂将女儿许配给他，「东床快婿」由此成为佳婿的代称。"},
   {t:"墨池临帖",d:"相传王羲之临池学书，日复一日在池边洗笔，池水都被染成墨色，故有「临池学书，池水尽墨」之说。他练字废寝忘食，甚至吃饭时都在比划字形，正是这份痴迷成就了一代书圣。"},
   {t:"兰亭雅集 · 天下第一行书",d:"353年三月初三，王羲之与谢安等四十一人在会稽山阴兰亭修禊，曲水流觞、饮酒赋诗。他乘兴为诗集作序，酒意酣畅之下一气呵成《兰亭集序》，字字珠玑、章法天成。唐太宗对它爱不释手，死后以真迹殉葬，后世所见均为摹本。"},
   {t:"入木三分",d:"相传王羲之写祝版，工匠刻字时发现笔迹透入木板三分深，足见其笔力遒劲。成语「入木三分」由此而来，也用来形容议论、分析极为深刻。"}

 {id:"taizong",name:"唐太宗李世民",period:"598—649",title:"唐朝皇帝",
  intro:"唐高祖李渊次子，随父起兵，平定天下。626年发动玄武门之变即位，年号贞观。他虚心纳谏、任人唯贤，轻徭薄赋、完善科举与三省六部，开创「贞观之治」；被各族尊为「天可汗」，是盛唐气象的开创者。",
  stories:[
   {t:"玄武门之变",d:"太子李建成与齐王李元吉联合排挤李世民。626年，李世民在玄武门设伏，射杀建成、元吉，随即被立为太子，不久受禅即位。这场兄弟相残的政变是李世民一生最大的争议，但此后他励精图治，以治国之功超越个人是非。"},
   {t:"以人为镜 · 魏征直谏",d:"魏征前后进谏二百余事，常当面顶撞太宗。太宗虽多次被气到要杀他，最终却叹道：「以铜为镜，可以正衣冠；以古为镜，可以知兴替；以人为镜，可以明得失。」魏征去世后，他说「朕亡一镜矣」。"},
   {t:"贞观之治",d:"太宗君臣以「水能载舟，亦能覆舟」为戒，轻徭薄赋、劝课农桑、慎刑狱、兴科举。贞观年间政治清明、经济复苏、社会安定，史称「贞观之治」，被后世视为治世的典范。"},
   {t:"天可汗",d:"太宗击败东突厥、平定西域，被西北各族首领尊为「天可汗」，唐朝由此成为东亚秩序的中心。长安城中胡商云集、万国来朝，开放包容的气度正是盛唐最迷人的一面。"},
   {t:"凌烟阁二十四功臣",d:"太宗命阎立本在凌烟阁绘长孙无忌、房玄龄、杜如晦、魏征、尉迟敬德等二十四位开国功臣画像，亲题赞语。凌烟阁成为后世士人「功成名就」的最高象征，「其中年少者如秦琼，老成者如程咬金，至今仍是隋唐英雄传说的主角。」"}
  ],

 {id:"wuzetian",name:"武则天",period:"624—705",title:"武周皇帝",
  intro:"中国历史上唯一的女皇帝。十四岁入宫为才人，历经太宗、高宗两朝，690年改唐为周，称帝十五年。她打击门阀士族、发展科举（首创殿试）、重视农桑，上承贞观、下启开元，为盛唐奠定基础。",
  stories:[
   {t:"驯马三策",d:"太宗有骏马狮子骢，无人能驯。时为才人的武则天说：「妾能制之。先用铁鞭，不服则用铁楇击其首，再不服则以匕首断其喉。」太宗虽未采纳，却见识了这个女子的刚烈手段。这个故事预示了她后来的铁腕统治。"},
   {t:"垂帘听政 · 二圣临朝",d:"高宗晚年体弱多病，政务多由武则天决断，史称「二圣临朝」。高宗驾崩后，她先后废中宗、立睿宗，690年正式登基称帝，改国号为周，成为中国历史上唯一的女皇帝。"},
   {t:"殿试与科举",d:"武则天开创殿试制度，亲自策问贡士，又设武举、扩大科举取士，使寒门子弟得以跻身朝堂。她还令人编撰《臣轨》规范臣道，打击关陇门阀，为后来的开元盛世输送了大量人才。"},
   {t:"无字碑",d:"武则天死后与高宗合葬乾陵，立了一块无字碑。有人说是她自认功过是非任由后人评说，也有人说是碑文难以尽述其一生。千年来无数文人凭吊题咏，这块无字碑反而成为中国历史上最意味深长的碑。"}
  ],

 {id:"libai",name:"李白",period:"701—762",title:"唐代诗人",
  intro:"字太白，号青莲居士，「诗仙」。一生仗剑远游、纵酒狂歌，诗风雄奇飘逸、想象瑰丽，与杜甫并称「李杜」。《将进酒》《蜀道难》《静夜思》等千余首诗作，是浪漫主义诗歌的巅峰。",
  stories:[
   {t:"铁杵磨针",d:"相传李白少年时读书厌烦，路遇老妪磨铁杵，问之，答曰「欲作针」。李白深受触动，从此发奋苦读，终成诗仙。故事虽近传说，「只要功夫深，铁杵磨成针」却激励了无数后来人。"},
   {t:"仗剑去国 · 辞亲远游",d:"李白二十四岁「仗剑去国，辞亲远游」，出蜀东下，游历江陵、金陵、扬州，「散金三十万」结交豪杰。壮游让他的诗有了山川湖海的气魄，也让「诗仙」之名广传天下。"},
   {t:"力士脱靴",d:"相传李白供奉翰林时醉后奉诏作诗，命高力士为他脱靴、杨国忠为他磨墨。高力士怀恨在心，借《清平调》中「飞燕」之句进谗，李白终被赐金放还。这个故事折射出诗仙傲视权贵的风骨。"},
   {t:"月下独酌 · 捉月传说",d:"李白一生爱月，《静夜思》《月下独酌》都是咏月名篇。民间传说他醉后于采石矶江上捉月，坠江仙去。传说未必为真，却恰如其分——只有「捉月」这样的结局，才配得上诗仙的一生。"},
   {t:"李杜文章在",d:"天宝年间李白与杜甫在洛阳相遇，结下深厚友谊。此后杜甫写下《春日忆李白》《梦李白》等诗，赞「笔落惊风雨，诗成泣鬼神」。唐诗双峰并峙，「李杜」之名流传千古。"}
  ],

   {t:"少年壮游 · 会当凌绝顶",d:"杜甫早年「放荡齐赵间，裘马颇清狂」，登泰山写下「会当凌绝顶，一览众山小」。青年时代的豪情壮志，与晚年「飘飘何所似，天地一沙鸥」的苍凉形成鲜明对照。"},
   {t:"安史之乱中的漂泊",d:"安史之乱爆发后，杜甫携家逃难，陷贼长安时写下「国破山河在，城春草木深」。他投奔肃宗任左拾遗，不久因直谏被贬，从此开始「漂泊西南天地间」的后半生。"},
   {t:"三吏三别",d:"杜甫在洛阳至华州途中，目睹战乱与兵役给百姓带来的苦难，写下《新安吏》《石壕吏》《潼关吏》与《新婚别》《垂老别》《无家别》。「吏呼一何怒，妇啼一何苦」，把乱世底层的声音写进了诗里。"},
   {t:"茅屋为秋风所破歌",d:"杜甫客居成都浣花溪，茅屋为秋风所破，雨漏如注，他却写下「安得广厦千万间，大庇天下寒士俱欢颜」。自己困顿至极仍心念天下寒士，这正是「诗圣」二字的分量。"},
   {t:"诗史千秋",d:"杜甫的诗真实记录了大唐由盛转衰的历史：开元盛世、安史之乱、百姓流离都在他的笔下有迹可循，故称「诗史」。他的沉郁顿挫、忧国忧民，深刻影响了此后一千多年的中国诗歌。"}
  ],

 {id:"xuanzang",name:"玄奘",period:"602—664",title:"唐代高僧、译经家",
  intro:"法相宗创始人。为求取真经，629年从长安出发西行，历经艰险到达天竺，在那烂陀寺研学十七载，辩才无碍。643年携带六百余部佛经归国，译经讲学十九年，口述《大唐西域记》，是中外文化交流的丰碑。",
  stories:[
   {t:"西行求法",d:"玄奘遍访名师后仍觉经义未明，决心西行天竺求取真经。当时朝廷严禁私自出境，他冒死出关，「不至天竺，终不东归一步」。此后十七年，他以坚定的信念走完五万里路程。"},
   {t:"大漠孤行",d:"玄奘穿越莫贺延碛大沙漠时失手打翻水囊，四夜五日滴水未进，几乎死在路上。他以「宁可就西而死，岂能归东而生」的意志支撑，终于在识途老马的帮助下走出绝境。"},
   {t:"那烂陀寺辩经",d:"玄奘在天竺最高学府那烂陀寺研习瑜伽行派经典，声名远播。戒日王为他举行无遮大会，他立论十八天无人能驳，被天竺僧俗尊为「大乘天」「解脱天」，是当之无愧的一代宗师。"},
   {t:"大唐西域记",d:"归国后玄奘奉太宗之命口述西行见闻，由弟子辩机笔录成《大唐西域记》，记载一百多个国家的山川、物产、风俗、宗教。这部书成为研究古印度及中亚历史的无价文献，被译成多国文字。"},
   {t:"取经与西游",d:"玄奘西行传奇成为《西游记》的原型，孙悟空、猪八戒、沙僧护送唐僧取经的故事家喻户晓。神话里九九八十一难是文学想象，而现实中的玄奘，用真实的脚步丈量了那段不可思议的旅程。"}
  ],

 {id:"wencheng",name:"文成公主",period:"约625—680",title:"唐宗室女、吐蕃赞蒙",
  intro:"641年，唐太宗将宗室女文成公主许配吐蕃赞普松赞干布。她携带佛像、典籍、工匠与先进生产技术入藏，主持修建大昭寺、小昭寺，促进唐蕃交流，汉藏「和同为一家」，至今传为佳话。",
  stories:[
   {t:"和亲吐蕃",d:"松赞干布统一青藏高原后多次遣使请婚，640年终于得偿所愿。641年文成公主由长安启程，经青海、过唐古拉山入藏，随行带去大量书籍、种子、工匠和释迦牟尼十二岁等身像，吐蕃从此与中原紧密相连。"},
   {t:"日月山与倒淌河",d:"相传文成公主行至赤岭时，因思念故乡取出日月宝镜，镜中现出长安景象，她泪流成河，倒淌向西。赤岭因此改名日月山，河流得名倒淌河。传说寄托了人们对这位远嫁公主的怜惜与敬意。"},
   {t:"和同一家",d:"文成公主入藏后，唐朝的造纸、酿酒、纺织、农艺技术传入吐蕃，吐蕃的良马、药材也输入中原。松赞干布上书「和同为一家」，唐蕃使者往来不绝，拉萨大昭寺前至今立着唐蕃会盟碑。"},
   {t:"大昭寺与布达拉宫",d:"文成公主主持修建大昭寺、小昭寺，藏民传说建寺时以白羊驮土填湖，成为拉萨建城的开端。松赞干布为她修建的布达拉宫，今天依然是汉藏文化交流最醒目的地标。"}
  ],

 {id:"jianzhen",name:"鉴真",period:"688—763",title:"唐代高僧",
  intro:"扬州大明寺高僧，律宗大师。应日本僧人邀请东渡传法，十一年间六次东渡、五次失败，双目失明仍矢志不渝。753年终于到达日本，传播佛法与唐朝建筑、医药、书法，主持修建唐招提寺，被尊为日本律宗开山祖师。",
  stories:[
   {t:"东渡之志",d:"742年，日本留学僧荣睿、普照恳请鉴真东渡传戒。弟子们认为沧海渺茫、九死一生，鉴真却说：「为法事也，何惜身命？诸人不去，我即去耳。」这一年他已经五十五岁。"},
   {t:"六次东渡",d:"从742年到753年，鉴真六次启航：第一次遭人告发，第二、三次遇风浪触礁，第四次被官府阻拦，第五次漂流到海南岛——他途中感染眼疾，双目失明，荣睿也病死途中。但每一次失败后，他都重新准备再出发。"},
   {t:"渡海成功 · 传戒日本",d:"753年，六十六岁、双目失明的鉴真第六次东渡成功，次年到达日本奈良。他在东大寺设坛授戒，天皇、皇后、皇太子及四百余僧众受戒，日本律宗由此确立，他被尊为开山祖师。"},
   {t:"唐招提寺",d:"鉴真在日本主持建造唐招提寺，其建筑、雕塑至今保留唐代风格，成为日本国宝。他还传播医药、书法、豆腐制作等技艺，被日本人民尊为「文化恩人」，唐招提寺里安放着他的坐像。"}
  ],

 {id:"yuefei",name:"岳飞",period:"1103—1142",title:"南宋抗金名将",
  intro:"字鹏举，相州汤阴人。「精忠报国」四字刺于背，率岳家军北伐屡败金军，郾城大捷后欲直捣黄龙，却被宋高宗以十二道金牌召回，遭秦桧构陷，以「莫须有」罪名屈死风波亭。《满江红》传唱千古。",
  stories:[
   {t:"岳母刺字",d:"相传岳飞从军前，母亲姚氏在他背上刺下「精忠报国」四字，勉励他以国为重。这四个字从此成为岳飞一生的信条，也成为中华民族爱国精神的象征。"},
   {t:"岳家军",d:"岳飞治军严明，赏罚分明，「冻死不拆屋，饿死不掳掠」，军队战斗力冠绝一时，金人哀叹「撼山易，撼岳家军难」。他的儿子岳云、部将张宪皆英勇善战，屡立战功。"},
   {t:"郾城大捷",d:"1140年岳飞第四次北伐，在郾城以步兵破金军铁浮屠、拐子马，大获全胜；又克颍昌、逼开封，金兀术几乎准备渡河北逃。岳飞豪言「直抵黄龙府，与诸君痛饮耳」，收复中原指日可待。"},
   {t:"十二道金牌",d:"就在岳飞节节胜利之际，宋高宗与秦桧为向金求和，一日内连发十二道金牌强令班师。岳飞愤慨泣下：「十年之功，毁于一旦！」回朝后不久，他以「莫须有」（意为「也许有吧」）的罪名被赐死于风波亭。"},
   {t:"满江红",d:"《满江红·怒发冲冠》是岳飞词作的代表：「三十功名尘与土，八千里路云和月……壮志饥餐胡虏肉，笑谈渴饮匈奴血」。虽其作者归属历代有争议，但词中气吞山河的报国之志，早已与岳飞的形象融为一体。"}
  ],

 {id:"wentianxiang",name:"文天祥",period:"1236—1283",title:"南宋民族英雄",
  intro:"南宋末年状元、丞相。元军南侵时散尽家财起兵勤王，兵败被俘，押解北上。元世祖忽必烈许以高官厚禄劝降，他宁死不屈，从容就义。「人生自古谁无死，留取丹心照汗青」成为千古绝唱。",
  stories:[
   {t:"起兵勤王",d:"1275年元军大举南下，朝廷下诏勤王。文天祥时任赣州知州，变卖家产、招募义军万人入卫临安，明知「驱群羊而搏猛虎」仍义无反顾。友人劝他，他说：「吾深恨于此，故不自量力，而以身殉之。」"},
   {t:"过零丁洋",d:"1278年文天祥兵败海丰被俘，元军押他经过零丁洋，他写下《过零丁洋》：「人生自古谁无死，留取丹心照汗青。」次年崖山海战宋亡，陆秀夫负帝昺蹈海，南宋覆灭，文天祥被解往大都（今北京）。"},
   {t:"正气歌",d:"文天祥被囚于大都土室三年，恶劣的环境中写下《正气歌》：「天地有正气，杂然赋流形。」他以浩然正气自励，面对忽必烈亲许的宰相之位，只答「天祥受宋恩，为宰相，安事二姓」，唯求一死。"},
   {t:"从容就义",d:"1283年1月，文天祥在柴市从容就义，衣带中留有绝笔：「孔曰成仁，孟曰取义，惟其义尽，所以仁至。读圣贤书，所学何事？而今而后，庶几无愧。」他的气节成为中华民族不屈精神的象征。"}
  ],
  evs:[30],locs:["beijing"],book:["cctv"]},
 {id:"chengjisi",name:"成吉思汗铁木真",period:"1162—1227",title:"蒙古帝国创立者",
  intro:"蒙古乞颜部首领之子，少年丧父、历经磨难，统一蒙古各部，1206年被推举为成吉思汗，建立大蒙古国。此后蒙古铁骑横扫欧亚，建立了空前庞大的帝国，深刻改变了世界历史进程。",
  stories:[
   {t:"少年磨难",d:"铁木真九岁时父亲被仇家毒死，部众离散，母子在斡难河畔艰难度日。他曾被泰赤乌部擒获，戴枷逃出；妻子曾被蔑儿乞部抢走。童年的苦难铸就了他坚忍、冷酷而又重情义的性格。"},
   {t:"统一蒙古 · 成吉思汗",d:"铁木真联合克烈部击败塔塔儿、蔑儿乞等部，又相继吞并克烈、乃蛮，1206年在斡难河源召开忽里台大会，被尊为「成吉思汗」，意为「拥有海洋四方的大汗」，蒙古汗国正式建立。"},
   {t:"蒙古铁骑与西征",d:"成吉思汗建立千户制、怯薛军与《大札撒》法典，以十进制的组织与闪电战术打造出无敌铁骑。1219年西征花剌子模，一路攻至中亚、波斯，蒙古帝国的版图由此急剧扩张。"},
   {t:"成吉思汗陵",d:"1227年成吉思汗在征西夏途中病逝。其陵墓（衣冠冢）位于内蒙古伊金霍洛旗，守陵人世代相传，每年举行盛大的祭典。这位「一代天骄」的陵寝与传说，至今仍是蒙古民族的精神圣地。"}
  ],
  evs:[29],locs:[],book:["cctv"]},
 {id:"hublie",name:"忽必烈",period:"1215—1294",title:"元朝皇帝",
  intro:"成吉思汗之孙、拖雷之子。1260年即大汗位，1271年改国号为元，定都大都（今北京）；1279年攻灭南宋完成统一。他推行行省制度，重用汉臣、重视农桑儒学，是建立元朝的一代雄主。",
  stories:[
   {t:"潜邸延揽汉儒",d:"忽必烈早年「思大有为于天下」，在藩邸广召刘秉忠、姚枢、许衡等汉族儒士，学习中原典章制度，「行汉法」的路线由此成形。这段经历让他在蒙古诸王中显得格外开明。"},
   {t:"开平建都",d:"1260年忽必烈在开平（今内蒙古正蓝旗）即大汗位，与留守和林（今蒙古国境内）的阿里不哥展开争位之战，历时四年获胜。他随后把政治中心从草原迁向中原，为建立元朝奠定了基础。"},
   {t:"灭宋统一",d:"1276年元军攻陷临安，南宋恭帝出降；1279年崖山海战宋军全灭，陆秀夫负帝投海，南宋灭亡。忽必烈完成中国历史上又一次大统一，西藏、云南等地也正式纳入中央管辖。"},
   {t:"行省制度",d:"忽必烈在全国推行行省制度，设中书省总理政务、行中书省分治地方。行省制度上承唐宋、下启明清，是今天中国省制的重要源头，也是元朝治理辽阔疆域的关键制度创新。"}
  ],
  evs:[30],locs:["beijing"],book:["cctv"]},
 {id:"zhuyuanzhang",name:"明太祖朱元璋",period:"1328—1398",title:"明朝开国皇帝",
  intro:"濠州钟离人，出身赤贫，当过放牛娃、做过和尚。元末群雄并起时投奔红巾军，经鄱阳湖之战击败陈友谅、扫平群雄，1368年称帝建立明朝。他废丞相、设锦衣卫，强化君主专制，同时休养生息，被后世视为布衣天子的传奇。",
  stories:[
   {t:"放牛娃与皇觉寺",d:"朱元璋家贫，少年时为地主放牛，父母兄长在瘟疫中相继离世，他入皇觉寺为僧，后又托钵化缘流浪三年。这段「乞丐和尚」的经历让他深知民间疾苦，也练就了坚韧与多疑的性格。"},
   {t:"投奔红巾军",d:"1352年朱元璋投奔濠州红巾军首领郭子兴，作战勇敢、处事机敏，娶郭子兴义女马氏（后来的马皇后），逐渐崭露头角。此后他南渡长江、占集庆（今南京），以「高筑墙、广积粮、缓称王」为战略稳步扩张。"},
   {t:"鄱阳湖之战",d:"1363年，朱元璋与陈友谅在鄱阳湖展开决战，兵力虽处劣势，却以火攻、水战与果断指挥大破陈友谅六十万大军，陈友谅中箭身亡。此战奠定朱元璋一统江南的胜局，是古代规模最大的水战之一。"},
   {t:"洪武之治",d:"朱元璋称帝后休养生息，奖励垦荒、兴修水利、减轻赋役，推行屯田；同时严惩贪官，「剥皮实草」的酷刑虽残忍，却让吏治一度清明。他还编《大明律》、定赋役黄册，奠定了明朝的根基。"},
   {t:"废丞相 · 设锦衣卫",d:"1380年，朱元璋以谋反罪处死丞相胡惟庸，宣布废除丞相制度，六部直接对皇帝负责，皇权空前集中。他还设立锦衣卫监察百官，开了明代厂卫特务政治的先河，也埋下了专制集权的阴影。"}
  ],
  evs:[31],locs:["nanjing","beijing"],book:["mingchao"]}

 {id:"zhenghe",name:"郑和",period:"1371—1433",title:"明代航海家",
  intro:"本名马和，回族，明成祖赐姓郑。1405年至1433年，他率庞大船队七下西洋，先后抵达三十余国，最远到达非洲东海岸与红海沿岸，是世界航海史上的壮举，比哥伦布远航早八十余年。",
  stories:[

   {t:"宝船与舰队",d:"郑和船队规模空前，据载最多时有大船六十余艘、人员两万七千余人，宝船长约四十四丈、九桅十二帆，是当时世界最大的木帆船。船队配备罗盘、牵星板等航海技术，编队浩荡，「云帆蔽日」。"},
   {t:"七下西洋",d:"1405年至1433年，郑和七次远航：首航便擒获海盗陈祖义，肃清南洋航道；第三次在锡兰山（今斯里兰卡）挫败劫掠；第四次深入波斯湾；第七次远达东非木骨都束（今索马里一带），与三十余国建立了朝贡贸易关系。"},
   {t:"和平的远航",d:"与欧洲殖民者的征服不同，郑和下西洋以「宣德化而柔远人」为宗旨，带去丝绸、瓷器、金银，换回香料、宝石、珍禽异兽，播下友谊。今天东南亚许多地方仍保留三宝庙、三宝垄等地名，纪念这位和平使者。"}

 {id:"qijiguang",name:"戚继光",period:"1528—1588",title:"明代抗倭名将",
  intro:"出身将门，字元敬。面对东南沿海倭患，他招募矿工、农民组建「戚家军」，发明鸳鸯阵，在台州九战九捷基本平定倭患；后调镇蓟州十六年，巩固北方边防，著《纪效新书》《练兵实纪》，是文武兼备的军事家。",
  stories:[
   {t:"鸳鸯阵",d:"针对倭寇近战凶狠、善于单打独斗的特点，戚继光创制「鸳鸯阵」：十二人一队，狼筅、长枪、盾牌、腰刀各司其职，长短兵器配合，攻守兼备。小阵机动灵活，在江南水乡的巷战、田塍中大显神威。"},
   {t:"戚家军",d:"戚继光在义乌招募矿工、农民三千人，严明军纪、赏罚必信，训练出「戚家军」。这支军队「冻死不拆屋、饿死不掳掠」，屡战屡胜，创造了「百战百胜」的纪录，成为晚明最精锐的部队。"},
   {t:"台州大捷",d:"1561年倭寇大举进犯台州，戚家军在一个多月里九战九捷，斩获数千，基本肃清浙江倭患；此后又入闽剿倭，与俞大猷配合作战，荡平福建、广东倭巢。东南沿海从此重归太平。"},
   {t:"镇守蓟门",d:"倭患平定后，戚继光调任蓟州总兵，镇守北方十六年。他修筑空心敌台、训练车步骑营、整饬边防，使蒙古朵颜等部不敢南犯。他把练兵经验写成《纪效新书》《练兵实纪》，被后世兵家奉为圭臬。"}

 {id:"lishizhen",name:"李时珍",period:"1518—1593",title:"明代医药学家",
  intro:"蕲州人，出身医学世家，曾任太医院判。他历时二十七年，跋涉采药、遍访民间验方、亲尝百草，三易其稿编成《本草纲目》，收录药物一千八百九十二种、药方一万一千余首，被誉为「东方医药巨典」。",
  stories:[
   {t:"弃科举而从医",d:"李时珍自幼体弱，父亲李言闻是当地名医。他三次乡试落第后立志学医，随父行医，很快因医术高明而闻名乡里。三十三岁时，他因治愈楚王世子之疾被荐入太医院，得以饱览宫廷藏书与各地贡药。"},
   {t:"亲尝百草",d:"为验证药性，李时珍遍访名山，采药问方，足迹遍及大江南北。传说他亲尝曼陀罗花，验证其麻醉功效；向渔夫、樵夫、猎人请教药物知识，纠正了前人大量谬误，「岁历三十稔，书考八百余家」。"},
   {t:"二十七载著巨典",d:"1552年起，李时珍以《证类本草》为底本开始编纂，其间三次重大修改，直到1578年才完成《本草纲目》，全书五十二卷、约一百九十万字。他分类科学、考据严谨，还纠正了历代本草中诸多张冠李戴的错误。"},
   {t:"东方医药巨典",d:"《本草纲目》1606年传入日本，此后被译成拉丁、英、法、德等多种文字。达尔文称其为「中国古代的百科全书」。李时珍「博极群书、勤求博采」的精神，使他成为世界科学史上的伟人。"}
  ],

 {id:"linzexu",name:"林则徐",period:"1785—1850",title:"清代民族英雄",
  intro:"福建侯官人，嘉庆进士。1838年受命为钦差大臣赴广东查禁鸦片，1839年虎门销烟震惊中外；他组织编译《四洲志》，被誉为「开眼看世界第一人」。「苟利国家生死以，岂因祸福避趋之」是其一生写照。",
  stories:[
   {t:"虎门销烟",d:"1839年6月，林则徐在虎门海滩当众销毁鸦片二百三十七万余斤，历时二十三天。他采用「海水浸化法」销毁，不使烟土流入江河。销烟壮举向世界表明中国人民禁烟的决心，也直接引发了鸦片战争。"},
   {t:"开眼看世界",d:"林则徐到广州后组织翻译《澳门月报》《四洲志》等书报，命人编译《各国律例》，深入了解西方。魏源受其嘱托编成《海国图志》，提出「师夷长技以制夷」。林则徐因此被誉为近代中国「开眼看世界第一人」。"},
   {t:"苟利国家生死以",d:"鸦片战争失利后，林则徐被革职遣戍伊犁。他写诗明志：「苟利国家生死以，岂因祸福避趋之。」在新疆他兴修水利、勘察屯田，依然为国尽力，展现出士大夫以天下为己任的担当。"},
   {t:"左宗棠夜话",d:"相传林则徐返京途经长沙时，在舟中接见青年左宗棠，彻夜长谈西北边防与天下大势，并将自己收集的新疆舆图资料相赠。二十余年后，左宗棠抬棺西征收复新疆，可说承续了林则徐的遗志。"}
  ],

 {id:"dengshichang",name:"邓世昌",period:"1849—1894",title:"清末海军将领",
  intro:"广东番禺人，毕业于福州船政学堂，北洋水师「致远」舰管带。1894年甲午黄海海战中，致远舰弹药将尽，他下令全速撞向日舰「吉野」，不幸中雷沉没，与全舰官兵壮烈殉国，年仅四十五岁。",
  stories:[
   {t:"致远舰管带",d:"邓世昌早年入福州船政学堂学习驾驶，成绩优异。1887年他奉命赴英国接回「致远」「靖远」等舰，航行途中亲自操练，使舰队安全抵达。此后他任致远舰管带，「使船如使马，鸣炮如鸣镝」，治军甚严。"},
   {t:"黄海海战",d:"1894年9月17日，北洋舰队与日本联合舰队在黄海大东沟遭遇。海战中，旗舰定远号帅旗被震落，邓世昌下令升起致远号战旗代领全军，鏖战五小时，先后击伤日舰数艘。"},
   {t:"撞沉吉野",d:"激战中致远舰弹药将尽、船身重创，邓世昌对全舰官兵说：「吾辈从军卫国，早置生死于度外，今日之事，有死而已！」遂下令开足马力撞向日军主力「吉野」号，不幸被鱼雷击中，军舰沉没。邓世昌坠海后拒绝救援，与爱犬同沉殉国。"},
   {t:"此日漫挥天下泪",d:"邓世昌殉国后，光绪帝亲书挽联：「此日漫挥天下泪，有公足壮海军威。」甲午之败、邓世昌之死，唤醒了国人的海权意识，也写下了中国近代海军史上最悲壮的一页。"}

 {id:"sunzhongshan",name:"孙中山",period:"1866—1925",title:"中国民主革命先行者",
  intro:"广东香山人，名文，字逸仙。早年行医，后立志革命，创立兴中会、同盟会，提出三民主义。1911年辛亥革命推翻清王朝，他就任中华民国临时大总统，结束两千多年君主专制，被尊为「国父」。",
  stories:[
   {t:"弃医从政",d:"孙中山早年学医于广州、香港，以优异成绩毕业，悬壶济世。但目睹国势日颓，他认识到「医国」比「医人」更重要，遂弃医投身革命，上书李鸿章未获回应后，彻底转向反清革命道路。"},
   {t:"兴中会与第一次起义",d:"1894年孙中山在檀香山创立兴中会，提出「驱除鞑虏，恢复中华，创立合众政府」；1895年策划广州起义，事败流亡海外。此后十六年间，他十次起义、十次失败，越挫越勇。"},
   {t:"三民主义",d:"1905年孙中山在东京创立同盟会，提出「民族、民权、民生」三民主义。民族主义推翻满清统治，民权主义建立共和政体，民生主义平均地权。三民主义成为辛亥革命的指导思想，影响了此后中国政治进程。"},
   {t:"辛亥革命与临时大总统",d:"1911年武昌起义爆发，各省纷纷响应。1912年1月1日孙中山在南京就任中华民国临时大总统，颁布《临时约法》，结束了两千多年的封建帝制。为促成南北统一，他旋即让位袁世凯，被世人称道为「天下为公」。"},
   {t:"革命尚未成功",d:"辛亥革命后，孙中山又领导二次革命、护法运动，屡败屡战。1925年他病逝于北京，临终遗言：「革命尚未成功，同志仍须努力。」他的奋斗与理想，为后来的中国现代化之路点燃了第一把火。"}

 {id:"maozedong",name:"毛泽东",period:"1893—1976",title:"开国领袖",
  intro:"湖南湘潭人，伟大的无产阶级革命家、战略家、理论家。他领导秋收起义、创建井冈山根据地，在遵义会议后确立领导地位，带领中国共产党和中国人民经过二十八年奋斗，1949年建立中华人民共和国，是新中国的主要缔造者。",
  stories:[
   {t:"橘子洲头 · 问苍茫大地",d:"青年毛泽东就读湖南第一师范，常与同学在橘子洲头畅谈国是。1925年他重游橘子洲，写下《沁园春·长沙》：「问苍茫大地，谁主沉浮？」豪情壮志，正是那一代青年救亡图存的缩影。"},
   {t:"秋收起义与井冈山",d:"1927年八七会议后，毛泽东领导湘赣边秋收起义，起义受挫后放弃攻打长沙，率部上井冈山，创建第一个农村革命根据地。他提出「农村包围城市、武装夺取政权」的革命道路，为中国革命指明了方向。"},
   {t:"长征与遵义会议",d:"第五次反「围剿」失败后，中央红军被迫长征。1935年遵义会议确立毛泽东在党中央和红军中的领导地位，此后四渡赤水、巧渡金沙江、飞夺泸定桥，红军历尽千难万险到达陕北，完成战略转移。"},
   {t:"论持久战",d:"抗战全面爆发后，「亡国论」与「速胜论」弥漫一时。1938年毛泽东发表《论持久战》，科学预言抗战将经历战略防御、相持、反攻三阶段，最终胜利属于中国。这篇著作坚定了全国军民抗战必胜的信心。"},
   {t:"中国人民从此站起来了",d:"1949年10月1日，毛泽东在北京天安门城楼庄严宣告：「中华人民共和国中央人民政府今天成立了！」开国大典上，中国人民从此站起来了，一个崭新的中国出现在世界东方。"}

 {id:"zhouenlai",name:"周恩来",period:"1898—1976",title:"开国总理",
  intro:"江苏淮安人。少年立志「为中华之崛起而读书」。他领导南昌起义，长期主持中共中央工作，是新中国首任总理兼外交部长，和平共处五项原则的提出者。他鞠躬尽瘁、死而后已，深受人民爱戴。",
  stories:[
   {t:"为中华之崛起而读书",d:"周恩来十二岁在沈阳东关模范学校读书时，老师问为何而读书，他朗声答道：「为中华之崛起而读书！」少年壮志贯穿其一生，也成为无数中国学生的座右铭。"},
   {t:"南昌起义",d:"1927年8月1日，周恩来与贺龙、叶挺、朱德等领导南昌起义，打响武装反抗国民党反动派的第一枪。8月1日因此成为中国人民解放军建军节，周恩来是人民军队的重要创建人之一。"},
   {t:"西安事变调停",d:"1936年西安事变爆发，周恩来作为中共代表赴西安，促成西安事变的和平解决，为国共第二次合作、共同抗日奠定基础。此后他在重庆、南京等地长期斡旋，被誉为「谈判大师」。"},
   {t:"和平共处五项原则",d:"1954年周恩来在访问印度、缅甸时提出「互相尊重主权和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处」五项原则，成为国际关系的重要准则；1955年万隆会议上，他倡导「求同存异」，让新中国外交赢得世界尊重。"},
   {t:"十里长街送总理",d:"1976年1月8日周恩来逝世，联合国为其降半旗致哀。北京数十万群众自发聚集长安街，送别总理灵车，「十里长街送总理」成为那个年代最动人的记忆。「为人民服务」五个字，他践行了一生。"}

 {id:"dayu",name:"大禹",period:"约前21世纪",title:"夏朝奠基者",intro:"治水十三年三过家门而不入，以疏导之法平定洪水，受舜禅让即位，后传位其子启，开启『家天下』时代。",stories:[{t:"三过家门而不入",d:"大禹治水十三年，三次经过自家门口都没有进去看望妻儿。他以身作则、公而忘私，最终疏通九河，奠定夏朝基业。"}]},

 {id:"yiyin",name:"伊尹",period:"约前16世纪",title:"商朝名相",intro:"出身奴隶、由庖厨起家，辅佐商汤灭夏；历事四朝，放逐昏君太甲又迎其复位，被尊为『元圣』，是贤相典范。",stories:[{t:"伊尹放太甲",d:"太甲即位后暴虐失德，伊尹将他放逐到桐宫反省，三年后太甲悔过，伊尹又迎他复位。宰相敢于放逐国君、又能劝其向善，成为千古美谈。"}]},
 {id:"panggeng",name:"盘庚",period:"约前14世纪",title:"商朝君主",intro:"力排众议迁都于殷，稳定了动荡的政局，使商朝进入最繁荣的时期，殷墟甲骨文记录了这座都城的辉煌。"},
 {id:"jiangzhiya",name:"姜子牙",period:"约前11世纪",title:"周朝开国元勋",intro:"渭水垂钓遇周文王，辅佐武王伐纣建周，封于齐，是兵家与齐国的始祖，『愿者上钩』的典故流传至今。",stories:[{t:"太公钓鱼，愿者上钩",d:"姜子牙在渭水边直钩垂钓，周文王问他这样怎能钓到鱼，他说『愿者上钩』。文王识其大才，拜他为师，后辅周灭商。"}]},
 {id:"zhouwuwang",name:"周武王姬发",period:"约前1087—前1043",title:"西周开国君主",intro:"继承文王遗志，会盟诸侯于孟津，牧野之战一举灭商，建立西周，分封天下、以藩屏周。"},
 {id:"zhougong",name:"周公旦",period:"约前11世纪",title:"西周政治家",intro:"武王之弟，摄政辅成王，平定三监之乱，制礼作乐、确立宗法分封，被儒家尊为『元圣』，孔子以梦周公为念。",stories:[{t:"周公吐哺",d:"周公礼贤下士，一饭三吐哺、一沐三握发，唯恐怠慢贤才。曹操《短歌行》『周公吐哺，天下归心』即用此典，形容求贤若渴。"}]},
 {id:"qihuangong",name:"齐桓公",period:"—前643",title:"春秋首霸",intro:"任用管仲改革，以『尊王攘夷』为号召九合诸侯、一匡天下，葵丘会盟达到霸业巅峰，是春秋五霸之首。"},
 {id:"guanzhong",name:"管仲",period:"约前723—前645",title:"春秋名相",intro:"辅佐齐桓公成就霸业，推行『相地而衰征』、官山海等改革，『仓廪实而知礼节』，是法家先驱与贤相楷模。"},
 {id:"jingong",name:"晋文公重耳",period:"前697—前628",title:"春秋霸主",intro:"流亡十九年历尽艰辛，回国后励精图治，城濮之战退避三舍大败楚军，践土会盟成为继齐桓公后的霸主。"},
 {id:"chuzhuangwang",name:"楚庄王",period:"—前591",title:"春秋霸主",intro:"一鸣惊人、问鼎中原，邲之战大败晋国成为霸主，是春秋五霸之一，也是『止戈为武』的践行者。",stories:[{t:"一鸣惊人",d:"楚庄王即位三年不理朝政，大臣伍举以『三年不飞不鸣之鸟』讽谏，庄王答：不飞则已，一飞冲天；不鸣则已，一鸣惊人。此后他整顿内政、开疆拓土，终成霸业。"}]},
 {id:"goujian",name:"越王勾践",period:"约前520—前465",title:"越国君主",intro:"吴越争霸中兵败屈事吴王夫差，卧薪尝胆二十余年，终灭吴国称霸中原，是忍辱负重、发愤图强的象征。"},
 {id:"kongzi",name:"孔子",period:"前551—前479",title:"儒家学派创始人",intro:"春秋末期思想家、教育家，创立儒家学说，主张仁与礼，有教无类、弟子三千，被尊为『至圣先师』。",stories:[{t:"韦编三绝",d:"孔子晚年研读《周易》，反复翻阅使穿竹简的皮绳断了三次。他感叹如果多活几年，就能把《周易》研究透彻——勤奋好学，终身不倦。"}]},
 {id:"laozi",name:"老子",period:"约前571—前471",title:"道家学派创始人",intro:"《道德经》作者，提出道法自然、无为而治，是中国哲学的开山鼻祖，其思想影响中华文明两千余年。"},
 {id:"mozi",name:"墨子",period:"约前468—前376",title:"墨家学派创始人",intro:"主张兼爱非攻、尚贤节用，创立墨家学派与严密组织，率徒止楚攻宋，是思想家与防御工程大师。"},
 {id:"mengzi",name:"孟子",period:"约前372—前289",title:"儒家亚圣",intro:"主张性善论与仁政，民贵君轻，游说诸侯不见用，退而著书立说，与孔子并称『孔孟』。"},
 {id:"zhuangzi",name:"庄子",period:"约前369—前286",title:"道家思想家",intro:"《逍遥游》《齐物论》的作者，追求精神自由，寓言汪洋恣肆，与老子并称『老庄』。"},
 {id:"xunzi",name:"荀子",period:"约前313—前238",title:"儒家思想家",intro:"主张性恶论与隆礼重法，提出制天命而用之，培养出韩非、李斯两位法家巨子。"},
 {id:"hanfei",name:"韩非",period:"约前280—前233",title:"法家集大成者",intro:"主张法术势结合、以法治国，著作《韩非子》为秦王政所叹服，其思想直接指导秦统一后的制度建设。"},
 {id:"sunwu",name:"孙武",period:"约前545—约前470",title:"兵家鼻祖",intro:"著《孙子兵法》十三篇，提出知己知彼、不战而屈人之兵，是世界军事理论的经典。"},
 {id:"sunbin",name:"孙膑",period:"约前380—前320",title:"战国军事家",intro:"遭庞涓陷害膑脚，后辅齐威王，围魏救赵、马陵道伏击庞涓，著《孙膑兵法》。",stories:[{t:"围魏救赵",d:"魏国攻赵，孙膑不直接救赵，而率齐军直捣魏都大梁，逼魏军回救，在桂陵设伏大胜，开创『攻其所必救』的经典战法。"}]},
 {id:"shangyang",name:"商鞅",period:"约前390—前338",title:"秦国改革家",intro:"在秦孝公支持下两次变法，废井田、奖军功、行县制，使秦国富强，虽被车裂而新法不废。"},
 {id:"quyuan",name:"屈原",period:"约前340—前278",title:"楚国诗人",intro:"《离骚》《九歌》的作者，楚辞的开创者，忠而被谤、投汨罗江殉国，端午节即源于纪念他。"},
 {id:"linxiangru",name:"蔺相如",period:"前3世纪",title:"赵国名相",intro:"完璧归赵、渑池会不辱使命，与廉颇将相和、负荆请罪，以大局为重传为美谈。"},
 {id:"lianpo",name:"廉颇",period:"前3世纪",title:"赵国名将",intro:"战国四大名将之一，征战数十年不败，负荆请罪与将相和的故事彰显其坦荡胸襟。"},
 {id:"baioi",name:"白起",period:"—前257",title:"秦国名将",intro:"战国四大名将之首，伊阙、鄢郢、长平等战功赫赫，人称『人屠』，为秦统一奠定军事基础。"},
 {id:"wangjian",name:"王翦",period:"前3世纪",title:"秦国名将",intro:"与白起并称，率军灭赵、楚等五国，以老成持重、功成身退著称。"},
 {id:"jingke",name:"荆轲",period:"—前227",title:"燕国刺客",intro:"受燕太子丹之托刺秦王，易水送别『风萧萧兮易水寒』，图穷匕见功败垂成，成为舍生取义的悲歌。"},
 {id:"lisi",name:"李斯",period:"约前284—前208",title:"秦朝丞相",intro:"辅佐秦始皇统一六国，主张郡县制、统一文字，后为赵高所害，被腰斩于咸阳。"},
 {id:"xiangyu",name:"项羽",period:"前232—前202",title:"西楚霸王",intro:"力拔山兮气盖世，巨鹿之战破釜沉舟灭秦主力，楚汉相争败于刘邦，乌江自刎，是悲剧英雄的化身。"},
 {id:"hanxin",name:"韩信",period:"约前231—前196",title:"汉初名将",intro:"汉初三杰之一，暗度陈仓、背水一战、十面埋伏，战无不胜，被萧何称为『国士无双』，后遭猜忌被杀。"},
 {id:"zhangliang",name:"张良",period:"约前250—前186",title:"汉初谋士",intro:"汉初三杰之一，运筹帷幄决胜千里，博浪沙刺秦、鸿门宴救主、功成身退，是智者的典范。"},
 {id:"xiaohe",name:"萧何",period:"前257—前193",title:"汉初丞相",intro:"汉初三杰之一，月下追韩信、镇抚关中、制定汉律，被称为『萧规曹随』的奠基者。"},
 {id:"weiqing",name:"卫青",period:"—前106",title:"西汉名将",intro:"出身骑奴，七战七捷大破匈奴，官至大将军，为人谦退仁厚，与霍去病并称帝国双璧。"},
 {id:"huoqubing",name:"霍去病",period:"前140—前117",title:"西汉名将",intro:"十八岁从军，六击匈奴，封狼居胥山，『匈奴未灭，何以家为』，二十四岁英年早逝。"},
 {id:"suwu",name:"苏武",period:"约前140—前60",title:"西汉使节",intro:"出使匈奴被扣十九年，北海牧羊持节不失，归汉时须发尽白，气节垂范千古。"},
 {id:"dongzhongshu",name:"董仲舒",period:"前179—前104",title:"西汉思想家",intro:"上《天人三策》提出罢黜百家、独尊儒术，构建天人感应学说，使儒学成为官方正统。"},
 {id:"wangzhaojun",name:"王昭君",period:"前1世纪",title:"西汉和亲使者",intro:"出塞和亲匈奴呼韩邪单于，促进汉匈和平数十年，『昭君出塞』是民族友好的象征。"},
 {id:"banshao",name:"班超",period:"32—102",title:"东汉外交家",intro:"投笔从戎，出使西域三十一年，使五十余国归附汉朝，重开丝绸之路，封定远侯。"},
 {id:"zhangheng",name:"张衡",period:"78—139",title:"东汉科学家",intro:"发明地动仪、浑天仪，著《灵宪》，在天文、文学、机械诸领域均有杰出成就。"},
 {id:"huatuo",name:"华佗",period:"约145—208",title:"东汉名医",intro:"首创麻沸散施行外科手术，创五禽戏健身，被尊为外科鼻祖，后为曹操所杀。"},
 {id:"zhangzhongjing",name:"张仲景",period:"约150—219",title:"医圣",intro:"著《伤寒杂病论》，确立辨证论治体系，被后世尊为医圣，方剂学鼻祖。"},
 {id:"caocao",name:"曹操",period:"155—220",title:"东汉末年政治家",intro:"挟天子以令诸侯，统一北方，唯才是举、屯田安民，建安文学领袖，『治世之能臣，乱世之奸雄』。"},
 {id:"liubei",name:"刘备",period:"161—223",title:"蜀汉开国皇帝",intro:"以仁德立世，三顾茅庐请出诸葛亮，赤壁之战后据益州建蜀汉，白帝城托孤。"},
 {id:"sunquan",name:"孙权",period:"182—252",title:"吴国开国皇帝",intro:"少年继位，赤壁之战联合刘备大破曹操，坐断东南，『生子当如孙仲谋』。"},
 {id:"guanyu",name:"关羽",period:"—220",title:"蜀汉名将",intro:"温酒斩华雄、千里走单骑、水淹七军，忠义千秋，被尊为武圣，与孔子并称文武二圣。"},
 {id:"zhouyu",name:"周瑜",period:"175—210",title:"东吴名将",intro:"赤壁之战总指挥，火烧曹军战船，『羽扇纶巾，谈笑间樯橹灰飞烟灭』，可惜英年早逝。"},
 {id:"simayi",name:"司马懿",period:"179—251",title:"三国政治家",intro:"隐忍多谋，高平陵之变夺取曹魏大权，为西晋建立奠定基础，是三国最大的赢家。"},
 {id:"taoyuanming",name:"陶渊明",period:"约365—427",title:"东晋诗人",intro:"不为五斗米折腰，归隐田园，开创田园诗派，《桃花源记》《饮酒》千古传诵。"},
 {id:"zuchongzhi",name:"祖冲之",period:"429—500",title:"南朝科学家",intro:"将圆周率精确到小数点后七位，著《缀术》《大明历》，是古代数学与天文学的巅峰人物。"},
 {id:"lidaoyuan",name:"郦道元",period:"约470—527",title:"北魏地理学家",intro:"著《水经注》四十卷，记载河流一千余条及沿途地理历史，是古代地理学巨著。"},
 {id:"jiasixie",name:"贾思勰",period:"5—6世纪",title:"北魏农学家",intro:"著《齐民要术》，系统总结北方农业生产技术，是我国现存最早最完整的综合性农书。"},
 {id:"xiean",name:"谢安",period:"320—385",title:"东晋名相",intro:"隐居东山、屡征不起，淝水之战运筹帷幄以少胜多，『东山再起』的成语即出自其归隐复出。"},
 {id:"xiaowendi",name:"北魏孝文帝",period:"467—499",title:"北魏皇帝",intro:"迁都洛阳、禁胡服胡语、改汉姓通婚姻，全面汉化改革，推动民族大融合。"},
 {id:"yangjian",name:"隋文帝杨坚",period:"541—604",title:"隋朝开国皇帝",intro:"代周建隋，灭陈统一南北，开皇之治仓廪充实，开创三省六部制与科举制雏形，被西方史家称为『圣人可汗』。"},
 {id:"yangguang",name:"隋炀帝杨广",period:"569—618",title:"隋朝皇帝",intro:"开凿大运河、创立科举、经营西域，功业宏大；但滥用民力、三征高丽，导致隋朝二世而亡。"},
 {id:"liyuan",name:"唐高祖李渊",period:"566—635",title:"唐朝开国皇帝",intro:"太原起兵反隋，攻入长安建立唐朝，定都长安，为贞观之治奠定基础。"},
 {id:"weizheng",name:"魏征",period:"580—643",title:"唐代名臣",intro:"以直谏著称，前后进谏二百余事，太宗以铜为镜、以史为镜、以人为镜，魏征即人镜。",stories:[{t:"以人为镜",d:"魏征病逝后，唐太宗悲痛地说：以铜为镜可以正衣冠，以史为镜可以知兴替，以人为镜可以明得失。魏征死，我失去了一面镜子。"}]},
 {id:"dierenjie",name:"狄仁杰",period:"630—700",title:"唐代名臣",intro:"断案如神、直言敢谏，两任宰相，力劝武则天还政李唐，被尊为『国老』。"},
 {id:"lizongji",name:"唐玄宗李隆基",period:"685—762",title:"唐朝皇帝",intro:"前期励精图治开创开元盛世，晚年宠信杨贵妃、重用奸臣，安史之乱使大唐由盛转衰。"},
 {id:"yangyuhuan",name:"杨玉环",period:"719—756",title:"杨贵妃",intro:"中国古代四大美女之一，深受玄宗宠爱，『一骑红尘妃子笑』；马嵬坡兵变中被缢死，成为千古悲剧。"},
 {id:"baijuyi",name:"白居易",period:"772—846",title:"唐代诗人",intro:"新乐府运动领袖，《长恨歌》《琵琶行》传唱千古，『文章合为时而著，歌诗合为事而作』。"},
 {id:"wangwei",name:"王维",period:"701—761",title:"唐代诗人画家",intro:"诗中有画、画中有诗，山水田园诗派代表，苏轼评其『诗中有画，画中有诗』。"},
 {id:"guoziyi",name:"郭子仪",period:"697—781",title:"唐代名将",intro:"平定安史之乱再造唐室，单骑退回纥，功高震主而善终，是『权倾天下而朝不忌』的完人。"},
 {id:"yanzhenqing",name:"颜真卿",period:"709—785",title:"唐代书法家",intro:"颜体楷书雄浑端庄，与柳公权并称『颜筋柳骨』；安史之乱中守城殉国，忠烈与书艺并传。"},
 {id:"sunsimiao",name:"孙思邈",period:"581—682",title:"药王",intro:"著《千金要方》《千金翼方》，提出大医精诚，寿逾百岁，被尊为药王。"},
 {id:"zhaokuangyin",name:"宋太祖赵匡胤",period:"927—976",title:"北宋开国皇帝",intro:"陈桥兵变黄袍加身建宋，杯酒释兵权、重文轻武，结束五代十国割据，奠定宋代文治格局。"},
 {id:"wanganshi",name:"王安石",period:"1021—1086",title:"北宋政治家",intro:"唐宋八大家之一，主持熙宁变法，『不畏浮云遮望眼』，变法虽败而忧国之心可鉴。"},
 {id:"simaguang",name:"司马光",period:"1019—1086",title:"北宋史学家",intro:"著编年体通史《资治通鉴》，『鉴于往事，有资于治道』，与司马迁并称史界双璧。"},
 {id:"sushi",name:"苏轼",period:"1037—1101",title:"北宋文学家",intro:"唐宋八大家之一，诗文书画全能，『大江东去』开豪放词风，一生坎坷而旷达。"},
 {id:"liqingzhao",name:"李清照",period:"1084—约1155",title:"宋代词人",intro:"婉约词宗，『知否知否，应是绿肥红瘦』，南渡后词风沉郁，千古第一才女。"},
 {id:"xinqiji",name:"辛弃疾",period:"1140—1207",title:"南宋词人",intro:"文武双全的抗金志士，词风豪放，『醉里挑灯看剑』，把满腔报国志写进词中。"},
 {id:"luyou",name:"陆游",period:"1125—1210",title:"南宋诗人",intro:"一生主张抗金，存诗九千余首，『王师北定中原日，家祭无忘告乃翁』，至死不渝。"},
 {id:"guoshoujing",name:"郭守敬",period:"1231—1316",title:"元代科学家",intro:"编制《授时历》，实测子午线，主持通惠河工程，天文水利成就领先世界数百年。"},
 {id:"huangdaopo",name:"黄道婆",period:"约1245—1330",title:"元代纺织家",intro:"从海南带回棉纺织技术并革新，使松江成为全国棉纺织中心，『衣被天下』。"},
 {id:"guanhanqing",name:"关汉卿",period:"约1234—1300",title:"元代戏剧家",intro:"元曲四大家之首，《窦娥冤》感天动地，『我是个蒸不烂、煮不熟、捶不匾、炒不爆、响珰珰一粒铜豌豆』。"},
 {id:"zhudi",name:"明成祖朱棣",period:"1360—1424",title:"明朝皇帝",intro:"靖难之役夺位，迁都北京、设内阁，派郑和下西洋，编《永乐大典》，开创永乐盛世。"},
 {id:"zhangjuzheng",name:"张居正",period:"1525—1582",title:"明代首辅",intro:"万历初年主持改革，推行一条鞭法与考成法，使明朝一度中兴，是晚明最杰出的政治家。"},
 {id:"hairui",name:"海瑞",period:"1514—1587",title:"明代清官",intro:"备棺上疏直谏嘉靖帝，一生清廉刚直，人称『海青天』，是清官的代名词。"},
 {id:"xuguangqi",name:"徐光启",period:"1562—1633",title:"明代科学家",intro:"与利玛窦合译《几何原本》，著《农政全书》，会通中西，是近代科学的先驱。"},
 {id:"songyingxing",name:"宋应星",period:"1587—约1666",title:"明代科学家",intro:"著《天工开物》，系统总结农工业生产技术，被誉为『中国17世纪的工艺百科全书』。"},
 {id:"yuanchonghuan",name:"袁崇焕",period:"1584—1630",title:"明末名将",intro:"宁远大捷炮伤努尔哈赤，宁锦大捷拒皇太极，最终被崇祯帝凌迟处死，是明亡前最后的柱石。"},
 {id:"zhengchenggong",name:"郑成功",period:"1624—1662",title:"民族英雄",intro:"1661年率军东渡，收复被荷兰占据三十八年的台湾，开辟荆榛，是收复台湾的民族英雄。"},
 {id:"kangxi",name:"康熙帝玄烨",period:"1654—1722",title:"清朝皇帝",intro:"八岁登基，擒鳌拜、平三藩、收台湾、逐沙俄，开创康乾盛世，在位六十一年的千古一帝。"},
 {id:"qianlong",name:"乾隆帝弘历",period:"1711—1799",title:"清朝皇帝",intro:"康乾盛世集大成者，十全武功、编纂四库全书，但晚年闭关锁国，盛世背后危机渐显。"},
 {id:"weiyuan",name:"魏源",period:"1794—1857",title:"清代思想家",intro:"著《海国图志》，提出『师夷长技以制夷』，开眼看世界的第一批中国人。"},

function h2(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,z){
 const ix=Math.floor(x),iz=Math.floor(z),fx=x-ix,fz=z-iz;
 const a=h2(ix,iz),b=h2(ix+1,iz),c=h2(ix,iz+1),d=h2(ix+1,iz+1);
 const ux=fx*fx*(3-2*fx),uz=fz*fz*(3-2*fz);
 return a*(1-ux)*(1-uz)+b*ux*(1-uz)+c*(1-ux)*uz+d*ux*uz;
}
function fbm(x,z){let v=0,f=1,a=.5;for(let i=0;i<3;i++){v+=a*vnoise(x*f,z*f);f*=2;a*=.5;}return v;}
function box(lon,lat,cx,cy,rx,ry){const q=Math.max(Math.abs(lon-cx)/rx,Math.abs(lat-cy)/ry);return q<1?1-q:0;}
function terrainH(lon,lat){
 const n=fbm(lon*.35+11,lat*.35+7);
 const tib=box(lon,lat,91,33.5,13,6.5)*10.5;
 const tian=box(lon,lat,86,44.2,7,2.4)*3.2;
 const west=Math.max(0,Math.min(1,(112-lon)/30))*Math.max(0,Math.min(1,(lat-24)/11))*3.2;
 const basin=box(lon,lat,105,30,4.6,3.0)*1.4;
 return Math.max(.6,.8+n*2.1+tib+tian+west*n-basin);
}
function inRing(x,y,ring){let inside=false;
 for(let i=0,j=ring.length-1;i<ring.length;j=i++){
  const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
 }
 return inside;
}
function insideChina(lon,lat){
 for(const f of GEO.feats){
  for(const poly of f.p){
   if(!inRing(lon,lat,poly[0]))continue;
   let hole=false;for(let k=1;k<poly.length;k++)if(inRing(lon,lat,poly[k])){hole=true;break;}
   if(!hole)return true;
  }
 }
 return false;
}
function heightColor(h){
 const stops=[[.7,0x37563a],[2.2,0x55653c],[4.0,0x7d6c3e],[6.5,0x968055],[9.5,0xb0a17e],[13,0xd6d0c0]];
 let a=stops[0],b=stops[stops.length-1];
 for(let i=0;i<stops.length-1;i++){if(h>=stops[i][0]&&h<=stops[i+1][0]){a=stops[i];b=stops[i+1];break;}}
 const t=Math.max(0,Math.min(1,(h-a[0])/(b[0]-a[0]||1)));
 const ca=new THREE.Color(a[1]),cb=new THREE.Color(b[1]);return ca.lerp(cb,t);
}

 const grd=g.createRadialGradient(64,64,2,64,64,62);
 grd.addColorStop(0,"rgba("+rgb+",.9)");grd.addColorStop(.35,"rgba("+rgb+",.35)");grd.addColorStop(1,"rgba("+rgb+",0)");
 g.fillStyle=grd;g.fillRect(0,0,128,128);

}
function makeLocTexture(loc){

function buildTerrain(){
 const sx=240,sz=164;
 const geo=new THREE.PlaneGeometry(W,D,sx,sz);
 geo.rotateX(-Math.PI/2);
 const pos=geo.attributes.position;
 const cells=[];
 for(let j=0;j<=sz;j++){cells[j]=[];for(let i=0;i<=sx;i++){
  const idx=j*(sx+1)+i,x=pos.getX(idx),z=pos.getZ(idx);
  const lon=LON0+(x+W/2)/W*(LON1-LON0);
  const lat=LAT0+(1-(z+D/2)/D)*(LAT1-LAT0);
  const inside=insideChina(lon,lat);
  cells[j][i]={lon,lat,inside,h:inside?terrainH(lon,lat):null,d:1e9,hnear:0};
 }}
 const queue=[];
 for(let j=0;j<=sz;j++)for(let i=0;i<=sx;i++)if(cells[j][i].inside){cells[j][i].d=0;queue.push([i,j]);}
 const dirs=[[1,0],[-1,0],[0,1],[0,-1]];let head=0;
 while(head<queue.length){
  const cur=queue[head++],c=cells[cur[1]][cur[0]];
  for(const [di,dj] of dirs){
   const ni=cur[0]+di,nj=cur[1]+dj;
   if(ni<0||nj<0||ni>sx||nj>sz)continue;
   const n=cells[nj][ni];
   if(n.d>c.d+1){n.d=c.d+1;n.hnear=c.d===0?c.h:c.hnear;queue.push([ni,nj]);}
  }
 }
 const sea=new THREE.Color(0x0c1e34),colors=[];
 for(let j=0;j<=sz;j++)for(let i=0;i<=sx;i++){
  const idx=j*(sx+1)+i,c=cells[j][i];let y,col;
  if(c.inside){y=c.h;col=heightColor(y);col.offsetHSL(0,0,fbm(c.lon*1.7+3,c.lat*1.7+3)*.12-.06);}
  else if(c.d<=3){const t=c.d/3;y=Math.max(-2.7,c.hnear*(1-t)*.92);col=heightColor(c.hnear).lerp(sea,Math.min(1,.45+t*.5));}
  else {y=-4;col=sea;}
  pos.setY(idx,y);colors.push(col.r,col.g,col.b);
 }
 geo.setAttribute("color",new THREE.Float32BufferAttribute(colors,3));
 geo.computeVertexNormals();
 scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:.92,metalness:.04})));
}
function buildBorders(){
 const lineOuter=new THREE.LineBasicMaterial({color:0xdcc489,transparent:true,opacity:.85});
 const lineInner=new THREE.LineBasicMaterial({color:0x97845f,transparent:true,opacity:.45});
 for(const f of GEO.feats){
  for(const poly of f.p){
   poly.forEach((ring,ri)=>{
    const lp=[];
    for(const [lon,lat] of ring){
     const ins=insideChina(lon,lat);
     const h=ins?Math.max(terrainH(lon,lat)+.28,1.3):-1.4;
     lp.push(proj(lon,lat,h));
    }
    const lg=new THREE.BufferGeometry().setFromPoints(lp);
    scene.add(new THREE.LineLoop(lg,ri===0?lineOuter:lineInner));
   });
  }
 }
}
function buildSea(){
 const g=new THREE.PlaneGeometry(1600,1200);g.rotateX(-Math.PI/2);
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x0c1e34,roughness:.5,metalness:.3,transparent:true,opacity:.96}));
 m.position.y=-3.2;scene.add(m);
}
function buildStars(){
 const n=700,p=[];
 for(let i=0;i<n;i++){
  const th=Math.random()*Math.PI*2,ph=Math.random()*.42,r=900;
  p.push(r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph)+60,r*Math.sin(ph)*Math.sin(th));
 }
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xbcc8e0,size:1.6,sizeAttenuation:false,transparent:true,opacity:.7})));
}

/* ---- 事件标记 ---- */
function buildMarkers(){
 const seen={};
 EV3D.forEach((ev,idx)=>{
  let lon=ev.lon,lat=ev.lat;
  const key=lon.toFixed(2)+"_"+lat.toFixed(2);
  if(seen[key]!=null){const k=seen[key]+1;const a=k*1.7;lon+=Math.cos(a)*.62;lat+=Math.sin(a)*.55;seen[key]=k;}else seen[key]=0;
  const color=CAT[ev.cat].c;
  const base=proj(lon,lat,0);const onLand=insideChina(lon,lat);const h=onLand?terrainH(lon,lat):-2.2;base.y=h;
  const grp=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:color,emissive:color,emissiveIntensity:.5,roughness:.5});
  const dot=new THREE.Mesh(new THREE.SphereGeometry(.95,14,14),mat);dot.position.y=1.5;grp.add(dot);
  const pillarMat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:.16,depthWrite:false});
  const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.16,.5,9,10),pillarMat);pillar.position.y=5.2;grp.add(pillar);
  const ringMat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false});
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.9,2.5,36),ringMat);ring.rotation.x=-Math.PI/2;ring.position.y=.35;grp.add(ring);
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlowTexture(color),transparent:true,opacity:0,depthWrite:false}));
  sprite.scale.set(13,13,1);sprite.position.y=9;grp.add(sprite);
  const hit=new THREE.Mesh(new THREE.CylinderGeometry(2.8,2.8,12,10),new THREE.MeshBasicMaterial({visible:false}));
  hit.position.y=5;hit.userData.idx=idx;grp.add(hit);hitMeshes.push(hit);
  grp.position.copy(base);scene.add(grp);
  markers.push({grp,dot,pillar,ring,sprite,state:0,ev});
 });
}
function buildRoutes(){
 EV3D.forEach((ev,idx)=>{
  if(!ev.rt)return;
  const pts=ev.rt.map(([lon,lat])=>{
   const onLand=insideChina(lon,lat);
   return proj(lon,lat,onLand?terrainH(lon,lat)+1.1:-1.7);
  });
  const curve=new THREE.CatmullRomCurve3(pts);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,140,.32,7,false),
    new THREE.MeshBasicMaterial({color:CAT[ev.cat].c,transparent:true,opacity:0,depthWrite:false}));
  tube.visible=false;scene.add(tube);
  const ball=new THREE.Mesh(new THREE.SphereGeometry(1.15,14,14),
    new THREE.MeshBasicMaterial({color:0xfff2cf}));
  ball.visible=false;scene.add(ball);
  routeMeshes[idx]={tube,curve,ball,prog:0};
 });
}
/* ---- 地点标注 ---- */
function buildLocations(){
 LOCS.forEach(loc=>{
  const onLand=insideChina(loc.lon,loc.lat);
  const base=proj(loc.lon,loc.lat,onLand?terrainH(loc.lon,loc.lat):-2.2);
  const grp=new THREE.Group();
  const ringMat=new THREE.MeshBasicMaterial({color:0xd8b866,transparent:true,opacity:.9,side:THREE.DoubleSide,depthWrite:false});
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.05,1.5,28),ringMat);
  ring.rotation.x=-Math.PI/2;ring.position.y=.3;grp.add(ring);
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:makeLocTexture(loc),transparent:true,depthWrite:false}));
  label.scale.set(19,7.1,1);label.position.y=onLand?terrainH(loc.lon,loc.lat)+3.4:-1;grp.add(label);
  const hit=new THREE.Mesh(new THREE.CylinderGeometry(4.6,4.6,16,10),new THREE.MeshBasicMaterial({visible:false}));
  hit.position.y=6;hit.userData.locId=loc.id;grp.add(hit);hitMeshes.push(hit);
  grp.position.copy(base);scene.add(grp);
  locGroups.push({grp,ring,label,loc,isCap:loc.type==="都城"});
 });
}


/* ---- 疆域变迁（随年代切换的边界线 + 半透明区域） ---- */
function makeTerrTexture(name, col){
 const c=document.createElement("canvas");c.width=256;c.height=72;const g=c.getContext("2d");
 g.font="700 30px 'Noto Sans SC',sans-serif";g.textAlign="center";g.textBaseline="middle";
 g.lineWidth=6;g.strokeStyle="rgba(6,10,20,.95)";g.lineJoin="round";
 g.strokeText(name,128,36);g.fillStyle=col;g.fillText(name,128,36);
 return new THREE.CanvasTexture(c);
}
function buildTerritories(){
 TERRITORIES.forEach((t,ti)=>{
  const g=new THREE.Group();g.visible=false;
  t.polys.forEach((poly,pi)=>{
   const col=new THREE.Color(poly.c||t.c);
   const pts=poly.p.map(([lon,lat])=>{
    const onLand=insideChina(lon,lat);
    return proj(lon,lat,onLand?Math.max(terrainH(lon,lat)+.55,1.35):-1.5);
   });
   const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({color:col,transparent:true,opacity:1,depthWrite:false}));
   g.add(line);
   const shape=new THREE.Shape();
   poly.p.forEach(([lon,lat],i)=>{
    const v=proj(lon,lat,0),pt=new THREE.Vector2(v.x,-v.z);
    i?shape.lineTo(pt.x,pt.y):shape.moveTo(pt.x,pt.y);
   });
   const mg=new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.3,side:THREE.DoubleSide,depthWrite:false,depthTest:false}));
   mg.rotation.x=-Math.PI/2;mg.position.y=1.5;mg.renderOrder=1;g.add(mg);
  });
  const label=new THREE.Sprite(new THREE.SpriteMaterial({map:makeTerrTexture(t.n,"#f4d98a"),transparent:true,depthWrite:false}));
  label.scale.set(26,7.4,1);label.position.copy(proj(t.lon||108,t.lat||35,0));label.position.y=Math.max(terrainH(t.lon||108,t.lat||35)+5.5,7);
  g.add(label);
  scene.add(g);terrGroups.push(g);
 });
 updateTerritory(lastTerr);
}
function updateTerritory(year){
 if(year==null)return;
 let ti=-1;
 for(let i=0;i<TERR_RANGES.length;i++){
  const r=TERR_RANGES[i];
  if(year>=r.y0&&year<r.y1){ti=r.t;break;}
 }
 if(ti===lastTerr)return;lastTerr=ti;
 terrGroups.forEach((g,i)=>{g.visible=terrOn&&i===ti;});
}
function toggleTerritory(on){
 terrOn=on;terrGroups.forEach((g,i)=>{g.visible=on&&i===lastTerr;});
}

/* ---- 相机触控 ---- */
let dragMode=null,lastX=0,lastY=0,pinchD=0,moved=0,downT=0;
function cameraApply(){
 const v=new THREE.Vector3(
  sp.r*Math.sin(sp.ph)*Math.sin(sp.th),sp.r*Math.cos(sp.ph),sp.r*Math.sin(sp.ph)*Math.cos(sp.th));
 camera.position.copy(target).add(v);camera.lookAt(target);
}
function bindControls(canvas){
 canvas.style.touchAction="none";
 canvas.addEventListener("pointerdown",e=>{
  try{canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);}catch(_){}
  if(e.isPrimary===false)return;
  lastX=e.clientX;lastY=e.clientY;moved=0;downT=performance.now();
  if(e.pointerType==="touch"){dragMode="tpan";}
  else if(e.button===2||e.button===1){dragMode="dpan";e.preventDefault();}
  else dragMode="pan";
 });
 canvas.addEventListener("pointermove",e=>{
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
  if(dragMode==="dpan"||dragMode==="tpan"){
   const s=sp.r*.0018;
   goalTarget.x-=dx*s;goalTarget.z+=dy*s;target.x=goalTarget.x;target.z=goalTarget.z;
   e.preventDefault();return;
  }
  if(dragMode!=="pan")return;
  sp.th-=dx*.0052;sp.ph=Math.max(.22,Math.min(1.42,sp.ph-dy*.0052));
  goalSp.th=sp.th;goalSp.ph=sp.ph;
 });
 canvas.addEventListener("pointerup",e=>{
  if((dragMode==="pan"||dragMode==="tpan")&&moved<9&&performance.now()-downT<350)handleTap(e);
  dragMode=null;
 });
 canvas.addEventListener("wheel",e=>{e.preventDefault();
  sp.r=Math.max(95,Math.min(560,sp.r*(1+e.deltaY*.0011)));goalSp.r=sp.r;
 },{passive:false});
 canvas.addEventListener("touchmove",e=>{
  if(e.touches.length===2){e.preventDefault();dragMode="pinch";
   const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
   if(pinchD){sp.r=Math.max(95,Math.min(560,sp.r*pinchD/d));goalSp.r=sp.r;}
   pinchD=d;
   const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2;
   if(pinchCX!==null){
    const s=sp.r*.0018;
    goalTarget.x-=(cx-pinchCX)*s;goalTarget.z+=(cy-pinchCY)*s;
    target.x=goalTarget.x;target.z=goalTarget.z;
   }
   pinchCX=cx;pinchCY=cy;
  }
 },{passive:false});
 canvas.addEventListener("touchend",e=>{if(e.touches.length<2){pinchD=0;pinchCX=null;}});
 canvas.addEventListener("contextmenu",e=>e.preventDefault());
}
function handleTap(e){
 const rect=renderer.domElement.getBoundingClientRect();
 const nx=((e.clientX-rect.left)/rect.width)*2-1,ny=-((e.clientY-rect.top)/rect.height)*2+1;
 const ray=new THREE.Raycaster();ray.setFromCamera({x:nx,y:ny},camera);
 const hits=ray.intersectObjects(hitMeshes,false);
 if(!hits.length)return;
 const hit=hits[0].object;
 if(hit.userData.idx!=null){onEventTap&&onEventTap(hit.userData.idx);}
 else if(hit.userData.locId){onLocTap&&onLocTap(hit.userData.locId);}
}

/* ---- 事件激活 / 路线动画 ---- */
function setMarkerState(m,state){
 m.state=state;
 if(state===0){m.ring.material.opacity=0;m.sprite.material.opacity=0;m.pillar.material.opacity=.16;m.dot.material.emissiveIntensity=.5;}
 else if(state===1){m.pillar.material.opacity=.55;m.dot.material.emissiveIntensity=1.1;pulseRings.push(m.ring);m.sprite.material.opacity=.95;}
 else if(state===2){m.ring.material.opacity=0;m.sprite.material.opacity=0;m.pillar.material.opacity=.4;m.dot.material.emissiveIntensity=.7;}
}
function focusOn(lon,lat,dist){const p=proj(lon,lat,0);goalTarget.set(p.x,0,p.z);goalSp.r=dist||165;goalSp.ph=.82;}
function playRoute(idx){
 const r=routeMeshes[idx];if(!r)return;
 r.tube.visible=true;r.ball.visible=true;r.prog=0;r.tube.material.opacity=0;
}
function stopActiveRoute(prevIdx){
 if(prevIdx==null)return;const r=routeMeshes[prevIdx];
 if(r){r.ball.visible=false;r.tube.material.opacity=.55;}
}

function init(geoData){
 GEO=geoData;
 const stage=document.getElementById("m3dStage");
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 renderer.setSize(stage.clientWidth,stage.clientHeight);
 stage.appendChild(renderer.domElement);
 scene=new THREE.Scene();scene.background=new THREE.Color(0x0a111e);scene.fog=new THREE.Fog(0x0a111e,420,950);
 camera=new THREE.PerspectiveCamera(48,stage.clientWidth/stage.clientHeight,.1,2000);
 target=new THREE.Vector3(0,0,0);goalTarget=new THREE.Vector3(0,0,0);
 scene.add(new THREE.HemisphereLight(0xbcd4ff,0x3a2c1e,.6));
 const sun=new THREE.DirectionalLight(0xffe6c0,1.15);sun.position.set(190,280,150);scene.add(sun);
 const fill=new THREE.DirectionalLight(0x88aaff,.3);fill.position.set(-150,90,-130);scene.add(fill);
 buildSea();buildTerrain();buildBorders();buildStars();buildMarkers();buildRoutes();buildLocations();buildTerritories();
 bindControls(renderer.domElement);
 window.addEventListener("resize",()=>{if(!renderer)return;
  const s=document.getElementById("m3dStage");
  renderer.setSize(s.clientWidth,s.clientHeight);camera.aspect=s.clientWidth/s.clientHeight;camera.updateProjectionMatrix();});
 sp.r=620;goalSp.r=380;sp.ph=.55;goalSp.ph=.78;
 clock=new THREE.Clock();
 animate();
}
function animate(){
 requestAnimationFrame(animate);
 if(document.hidden)return; /* 页面不可见时暂停渲染省电 */
 const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 sp.r+=(goalSp.r-sp.r)*.07;sp.th+=(goalSp.th-sp.th)*.07;sp.ph+=(goalSp.ph-sp.ph)*.07;
 target.lerp(goalTarget,.06);cameraApply();
 /* 地点标签按距离显隐 */
 const labelOn=sp.r<300;
 locGroups.forEach(g=>{g.label.visible=labelOn||g.isCap;g.ring.material.opacity=labelOn?1:.45;});
 /* 脉冲 */
 for(let i=pulseRings.length-1;i>=0;i--){const r=pulseRings[i];
  const m=markers.find(x=>x.ring===r);
  if(!m||m.state!==1){pulseRings.splice(i,1);r.material.opacity=0;continue;}
  const s=1+((t*1.3)%1)*.55;r.scale.set(s,s,s);r.material.opacity=.85*(1-((t*1.3)%1));
 }
 /* 路线流动 */
 for(const k in routeMeshes){
  const r=routeMeshes[k];
  if(r.ball.visible){
   r.prog=Math.min(1,r.prog+dt/3.2);
   r.ball.position.copy(r.curve.getPoint(r.prog));
   r.tube.material.opacity=Math.min(.6,r.prog*.7);
   if(r.prog>=1){r.prog=0;}
  }
 }
 markers.forEach(m=>{if(m.state===1)m.sprite.position.y=9+Math.sin(t*3)*.5;});
 renderer.render(scene,camera);
}
function resetView(){goalTarget.set(0,0,0);goalSp.r=380;goalSp.th=0;goalSp.ph=.78;sp.th=0;}

return {init,playRoute,stopActiveRoute,setMarkerState,focusOn,resetView,markers,routeMeshes,locGroups,CAT,
 updateTerritory,toggleTerritory,
 setTapHandlers(ev,loc){onEventTap=ev;onLocTap=loc;},
