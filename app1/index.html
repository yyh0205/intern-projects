/* ---- 乱世关系图谱（三国/南北朝/五代十国） ---- */
const REL_KIND={dai:"#e8b84b",mie:"#e0483b",fen:"#9ecbff"};
function openRelGraph(id){
 const G=REL_GRAPHS[id]||PPL_REL[id];if(!G)return;
 const isPpl=!!PPL_REL[id];
 const d=isPpl?PPL_INDEX[id]:DYN.find(x=>x.id===id);if(!d)return;
 const mid=(a,b)=>[(a.x+a.w/2+b.x+b.w/2)/2,(a.y+a.h/2+b.y+b.h/2)/2];
 let svg='<svg class="rel-svg" viewBox="0 0 '+G.w+' '+G.h+'" xmlns="http://www.w3.org/2000/svg">'+
  '<defs><marker id="arr'+id+'" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e8b84b"/></marker></defs>';
 G.edges.forEach(e=>{
  const na=G.nodes[e.a],nb=G.nodes[e.b];
  const x1=na.x+na.w,y1=na.y+na.h/2,x2=nb.x,y2=nb.y+nb.h/2;
  const col=REL_KIND[e.kind]||"#e8b84b";
  svg+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="1.8"'+(e.kind==="fen"?' stroke-dasharray="6 4"':"")+' marker-end="url(#arr'+id+')" opacity=".85"/>';
  const m=mid(na,nb);
  svg+='<text x="'+m[0]+'" y="'+(m[1]-6)+'" text-anchor="middle" font-size="11" fill="'+col+'" opacity=".95">'+esc(e.label)+'</text>';
 });
 G.nodes.forEach(n=>{
  svg+='<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="10" fill="rgba(14,22,42,.88)" stroke="#'+n.c+'" stroke-width="1.6" opacity=".96"/>'+
   '<text x="'+(n.x+n.w/2)+'" y="'+(n.y+n.h/2-2)+'" text-anchor="middle" font-size="16" font-weight="700" fill="#f2f5fb">'+esc(n.name)+'</text>'+
   '<text x="'+(n.x+n.w/2)+'" y="'+(n.y+n.h/2+18)+'" text-anchor="middle" font-size="11" fill="#c9d6e8">'+esc(n.years)+'</text>';
 });
 svg+='</svg>';
 let html='<div class="d-head"><span class="d-cat" style="color:#9ecbff;border-color:#9ecbff">'+(isPpl?"人物关系":"乱世图谱")+'</span>'+
  '<span class="d-time">'+esc(d.name)+(d.period?" "+esc(d.period):d.y?" "+esc(d.y):"")+'</span></div>'+
  '<h3 class="d-title">'+esc(G.title)+'</h3>'+
  '<p class="d-intro">'+esc(G.legend)+'</p>'+
  '<div class="rel-box">'+svg+'</div>'+
  '<div class="d-sep"></div><button class="d-nav" id="m3dRelClose">关闭</button>';
 openModal(html);
 document.getElementById("m3dRelClose").onclick=closeModal;
}

function schedule(){
 clearTimeout(autoTimer);
 if(!playing)return;
 const ev=EV3D[curIdx];
 autoTimer=setTimeout(()=>{
  if(curIdx<EV3D.length-1)goto(curIdx+1,false);
  else{playing=false;syncPlay();toast("长卷已展至当代，可点重置从头观看");}
 },ev.rt?7800:4300);
}

/* 时间轴拖拽滑动：按住朝代轴/事件条可手动拖动，双条联动（触屏走原生滚动） */
function bindDragScroll(a,b){
 let sx=0,sl=0,on=false,moved=false;
 a.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="mouse"||(e.button&&e.button!==0))return;
  on=true;moved=false;sx=e.clientX;sl=a.scrollLeft;
  try{a.setPointerCapture(e.pointerId);}catch(_){}
 });
 a.addEventListener("pointermove",e=>{
  if(!on)return;
  const dx=e.clientX-sx;
  if(Math.abs(dx)>5)moved=true;
  if(moved){
   a.scrollLeft=sl-dx;
   const ar=a.scrollWidth-a.clientWidth,br=b.scrollWidth-b.clientWidth;
   if(ar>0&&br>0)b.scrollLeft=(a.scrollLeft/ar)*br;
  }
 });
 const up=()=>{if(!on)return;on=false;if(moved){a.classList.add("m3d-dragging");setTimeout(()=>a.classList.remove("m3d-dragging"),90);}};
 a.addEventListener("pointerup",up);a.addEventListener("pointercancel",up);
}

function goto(idx,userTap){
 if(idx<0||idx>=EV3D.length)return;
 const prev=curIdx;curIdx=idx;const ev=EV3D[idx];
 MAP3D.markers.forEach((m,i)=>{
  if(i===idx)MAP3D.setMarkerState(m,1);
  else if(i<idx)MAP3D.setMarkerState(m,2);
 });
 MAP3D.stopActiveRoute(prev);
 if(ev.rt)MAP3D.playRoute(idx);
 MAP3D.focusOn(ev.lon,ev.lat,ev.rt?300:165);
 document.getElementById("m3dYear").textContent=ev.time;
 document.getElementById("m3dDyn").textContent=ev.era;
 document.getElementById("m3dProg").style.width=(idx/(EV3D.length-1)*100)+"%";
 document.querySelectorAll("#m3dChips .m3d-chip").forEach((c,i)=>c.classList.toggle("on",i===idx));
 const onChip=document.querySelectorAll("#m3dChips .m3d-chip")[idx];
 if(onChip)onChip.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
 if(dynOpen){dynSel=curDynIdx();const rs=document.querySelectorAll("#m3dDynRail .dyn-seg");rs.forEach((s,i)=>s.classList.toggle("on",i===dynSel));}
 updateAxisCursor();
 if(MAP3D.updateTerritory)MAP3D.updateTerritory(ev.y);
 schedule();
}
function buildChips(){
 const box=document.getElementById("m3dChips");
 box.innerHTML=EV3D.map((e,i)=>'<button class="m3d-chip" data-i="'+i+'">'+
  '<span class="mc-dot" style="background:#'+CAT_HEX[e.cat]+'"></span>'+
  '<span class="mc-time">'+esc(e.time)+'</span><span class="mc-name">'+esc(e.name.replace(/ · .*/,""))+'</span></button>').join("");
 box.querySelectorAll(".m3d-chip").forEach(c=>c.addEventListener("click",()=>{if(c.closest(".m3d-dragging"))return;playing=false;clearTimeout(autoTimer);syncPlay();goto(+c.dataset.i,true);openEvent(+c.dataset.i);}));
}
/* ---- 朝代时间轴（底部一条分段线） ---- */
const AXIS_T0=-2070,AXIS_T1=1949,AXIS_PX=42/100;
function hexRgb(h){h=String(h).replace("#","");return parseInt(h.substr(0,2),16)+","+parseInt(h.substr(2,2),16)+","+parseInt(h.substr(4,2),16);}
function fmtYear(v){return v<0?"前"+(-v):""+v;}
function renderDynAxis(){
 const inner=document.getElementById("m3dDynAxisInner");if(!inner)return;
 inner.innerHTML=DYN_AXIS.map((d,i)=>{
  const rgb=hexRgb(d.c);
  return '<button class="dynaxis-seg" data-i="'+i+'" style="background:linear-gradient(180deg,rgba('+rgb+',.34),rgba('+rgb+',.13))">'+
   '<span class="da-txt">'+d.n+'</span><span class="da-year">'+fmtYear(d.s)+'</span></button>';
 }).join("");
 inner.querySelectorAll(".dynaxis-seg").forEach(b=>b.onclick=()=>{if(b.closest(".m3d-dragging"))return;
  const i=+b.dataset.i;dynSel=i;toggleDyn(true,true);renderDyn();
  const dyn=DYN[i];
  if(dyn&&dyn.idx&&dyn.idx.length)goto(dyn.idx[0],true);
 });
 updateAxisCursor();
}
function updateAxisCursor(){
 const c=document.getElementById("m3dDynCursor");if(!c)return;
 const y=(curIdx>=0&&EV3D[curIdx])?EV3D[curIdx].y:AXIS_T0;
 c.style.left=((y-AXIS_T0)*AXIS_PX)+"px";
 const segs=document.querySelectorAll("#m3dDynAxisInner .dynaxis-seg");
 let si=-1;
 if(curIdx>=0){
  for(let i=0;i<DYN_AXIS.length;i++){
   const s=DYN_AXIS[i].s,nx=(i+1<DYN_AXIS.length?DYN_AXIS[i+1].s:AXIS_T1);
   if(y>=s&&y<nx){si=i;break;}
  }
 }
 segs.forEach((s,i)=>s.classList.toggle("on",i===si));
}

/* ---- 搜索 ---- */
function doSearch(){
 const q=document.getElementById("m3dSearchInput").value.trim();
 searchQ=q;const box=document.getElementById("m3dSuggest");
 if(!q){box.innerHTML="";return;}
 const hits=[];
 EV3D.forEach((e,i)=>{if((e.name+e.desc+e.time).indexOf(q)>=0)hits.push({t:"事件",i,title:e.name+"（"+e.time+"）",id:"ev"+i});});
 LOCS.forEach(l=>{if((l.ancient+l.now+l.intro).indexOf(q)>=0)hits.push({t:"地点",i:l.id,title:l.ancient+" → "+l.now,id:"loc"+l.id});});
 PPLS.forEach(p=>{if((p.name+p.title+p.intro+(p.stories||[]).map(s=>s.t+s.d).join("")).indexOf(q)>=0)hits.push({t:"人物",i:p.id,title:p.name+"（"+p.period+"）",id:"ppl"+p.id});});
 box.innerHTML=hits.slice(0,9).map(h=>'<div class="s-item"><span class="s-tag">'+h.t+'</span><span>'+esc(h.title)+'</span></div>').join("")
   +(hits.length===0?'<div class="s-empty">未找到相关内容，换个关键词试试</div>':"");
 box.querySelectorAll(".s-item").forEach((el,ni)=>{
  el.onclick=()=>{
   box.innerHTML="";document.getElementById("m3dSearchBox").style.display="none";document.getElementById("m3dSearchInput").value="";
   const h=hits[ni];
   if(h.t==="事件"){goto(+h.i,true);openEvent(+h.i);}
   else if(h.t==="地点"){focusLoc(h.i);openLoc(h.i);}
   else{openPpl(h.i);}
  };
 });
}

/* ---- 面板列表 ---- */
function renderPanel(){
 const list=document.getElementById("m3dList"),filters=document.getElementById("m3dFilters");
 list.scrollTop=0;
 if(panelTab==="ev"){
  filters.innerHTML='<button class="fchip '+(selCat==null?"on":"")+'" data-c="">全部</button>'+
   Object.keys(CAT_HEX).map(c=>'<button class="fchip '+(selCat===c?"on":"")+'" data-c="'+c+'" style="color:#'+CAT_HEX[c]+'">'+CAT_NAME[c]+'</button>').join("");
  filters.querySelectorAll(".fchip").forEach(b=>b.onclick=()=>{selCat=b.dataset.c||null;renderPanel();});
  const arr=EV3D.filter(e=>!selCat||e.cat===selCat);
  list.innerHTML=arr.map((e,i)=>{
   const idx=EV3D.indexOf(e);
   return '<button class="l-item ev" data-i="'+idx+'"><span class="l-dot" style="background:#'+CAT_HEX[e.cat]+'"></span>'+
    '<span class="l-main"><span class="l-name">'+esc(e.name)+'</span><span class="l-time">'+esc(e.time)+' · '+esc(e.era)+'</span></span>'+
    '<span class="l-go">›</span></button>';}).join("");
  list.querySelectorAll(".l-item.ev").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;goto(i,true);openEvent(i);});
 }else if(panelTab==="loc"){
  filters.innerHTML="";
  list.innerHTML=LOCS.map(l=>'<button class="l-item loc" data-id="'+l.id+'"><span class="l-dot locd"></span>'+
   '<span class="l-main"><span class="l-name">'+esc(l.ancient)+' <i>→</i> '+esc(l.now)+'</span><span class="l-time">'+esc(l.type==="都城"?"古都 · 都城":"历史名城")+'</span></span><span class="l-go">›</span></button>').join("");
  list.querySelectorAll(".l-item.loc").forEach(b=>b.onclick=()=>{const id=b.dataset.id;focusLoc(id);openLoc(id);});
 }else if(panelTab==="ppl"){
  filters.innerHTML="";
  list.innerHTML=PPLS.map(p=>'<button class="l-item ppl" data-id="'+p.id+'"><span class="l-dot ppl-d"></span>'+
   '<span class="l-main"><span class="l-name">'+esc(p.name)+'</span><span class="l-time">'+esc(p.period)+' · '+esc(p.title)+'</span></span><span class="l-go">›</span></button>').join("");
  list.querySelectorAll(".l-item.ppl").forEach(b=>b.onclick=()=>openPpl(b.dataset.id));
 }else if(panelTab==="book"){
  filters.innerHTML="";
  const ks=Object.keys(BOOKS);
  const books=ks.filter(k=>BOOKS[k].k==="书"),films=ks.filter(k=>BOOKS[k].k==="片");
  list.innerHTML='<div class="book-group"><h4>书籍推荐</h4>'+
   books.map(k=>bookRow(k)).join("")+'</div>'+
   '<div class="book-group"><h4>纪录片 / 节目推荐</h4>'+films.map(k=>bookRow(k)).join("")+'</div>';
  list.querySelectorAll(".b-item").forEach(b=>b.onclick=()=>openBook(b.dataset.id));
 }
}
function bookRow(k){const b=BOOKS[k];return '<button class="b-item" data-id="'+k+'"><span class="b-tag">'+b.k+'</span><span class="b-main"><span class="b-name">'+esc(b.t)+'</span><span class="b-desc">'+esc(b.d)+'</span></span></button>';}

/* ---- 详情弹层 ---- */
function openModal(html){
 const m=document.getElementById("m3dModal");
 document.getElementById("m3dModalInner").innerHTML=html;
 m.classList.add("show");document.getElementById("m3dMask").style.display="block";
 m.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>{
  const v=el.dataset.nav.split(":");const[type,id]=v;
  if(type==="ev"){const i=+id;goto(i,true);openEvent(i);}
  else if(type==="loc"){if(id==="return"){closeModal();togglePanel(true);}else{focusLoc(id);openLoc(id);}}
  else if(type==="ppl"){if(id==="return"){closeModal();togglePanel(true);}else openPpl(id);}
  else if(type==="book"){if(id==="return"){closeModal();togglePanel(true);}else openBook(id);}
 });
}
function closeModal(){
 document.getElementById("m3dModal").classList.remove("show");
 document.getElementById("m3dMask").style.display=(panelOpen||dynOpen)?"block":"none";
}
function bookChips(ids){
 if(!ids||!ids.length)return "";
 return '<div class="d-section"><h5>书影推荐</h5><div class="d-books">'+
  ids.map(b=>'<button class="d-book" data-nav="book:'+b+'"><span class="b-tag sm">'+BOOKS[b].k+'</span>'+esc(BOOKS[b].t)+'</button>').join("")+'</div></div>';
}
function chipLinks(type,ids){
 if(!ids||!ids.length)return "";
 const names=type==="loc"?LOC_INDEX:type==="ppl"?PPL_INDEX:null;
 return '<div class="d-chips">'+ids.map(id=>{
  const o=names[id];if(!o)return "";
  const label=type==="loc"?o.ancient+"（"+o.now+"）":o.name;
  return '<button class="d-chip" data-nav="'+type+':'+id+'">'+esc(label)+'</button>';}).join("")+'</div>';
}
function openEvent(idx){
 const e=EV3D[idx];
 const enh=e.bg?{bg:e.bg,proc:e.proc,imp:e.imp}:null;
 const relLoc=(e.loc||[]).filter(id=>LOC_INDEX[id]);
 const relPpl=(e.ppl||[]).filter(id=>PPL_INDEX[id]);
 openModal(
  '<div class="d-head"><span class="d-cat" style="color:#'+CAT_HEX[e.cat]+';border-color:#'+CAT_HEX[e.cat]+'">'+CAT_NAME[e.cat]+'</span>'+
   '<span class="d-time">'+esc(e.time)+' · '+esc(e.era)+'</span></div>'+
  '<h3 class="d-title">'+esc(e.name)+'</h3>'+
  '<p class="d-intro">'+esc(e.desc)+'</p>'+
  (enh?'<div class="d-section"><h5>背景</h5><p>'+esc(enh.bg)+'</p></div>'+
      '<div class="d-section"><h5>经过</h5><p>'+esc(enh.proc)+'</p></div>'+
      '<div class="d-section"><h5>影响与意义</h5><p>'+esc(enh.imp)+'</p></div>'
    :'<div class="d-section"><p class="d-todo">详细背景持续补充中…</p></div>')+
  (relPpl.length?'<div class="d-section"><h5>相关人物</h5>'+chipLinks("ppl",relPpl)+'</div>':"")+
  (relLoc.length?'<div class="d-section"><h5>相关地点</h5>'+chipLinks("loc",relLoc)+'</div>':"")+
  (e.rt?'<div class="d-section"><h5>路线演绎</h5><p class="d-route">金色小球沿发光路线行进，可观察事件的空间轨迹。</p></div>':"")+
  bookChips(e.book)+
  '<div class="d-sep"></div><div class="d-navrow">'+
   '<button class="d-nav" data-nav="ev:'+Math.max(0,idx-1)+'">‹ 上一事件</button>'+
   '<span class="d-pos">'+(idx+1)+' / '+EV3D.length+'</span>'+
   '<button class="d-nav" data-nav="ev:'+Math.min(EV3D.length-1,idx+1)+'">下一事件 ›</button></div>');
}
function openLoc(id){
 const l=LOC_INDEX[id];if(!l)return;
 const evs=(l.evs||[]).map(oi=>EV3D.findIndex(e=>e._i===oi)).filter(i=>i>=0);
 const ppl=(l.ppl||[]).filter(x=>PPL_INDEX[x]);
 openModal(
  '<div class="d-head"><span class="d-cat" style="color:#d8b866;border-color:#d8b866">'+esc(l.type==="都城"?"古都 / 都城":"历史名城")+'</span>'+
   '<span class="d-time">今·'+esc(l.now)+'</span></div>'+
  '<h3 class="d-title">'+esc(l.ancient)+'<i class="d-arrow">→</i>'+esc(l.now)+'</h3>'+
  '<p class="d-intro">'+esc(l.intro)+'</p>'+
  '<div class="d-section"><h5>历史故事</h5><p>'+esc(l.story||"故事持续补充中…")+'</p></div>'+
  (evs.length?'<div class="d-section"><h5>这里发生的大事</h5><div class="d-chips">'+evs.map(e=>'<button class="d-chip" data-nav="ev:'+e+'">'+esc(EV3D[e].time+' '+EV3D[e].name)+'</button>').join("")+'</div></div>':"")+
  (ppl.length?'<div class="d-section"><h5>相关人物</h5>'+chipLinks("ppl",ppl)+'</div>':"")+
  bookChips(l.book)+
  '<div class="d-sep"></div><button class="d-nav" data-nav="loc:return">返回列表</button>');
}
function openPpl(id){
 const p=PPL_INDEX[id];if(!p)return;
 const evs=(p.evs||[]).map(oi=>EV3D.findIndex(e=>e._i===oi)).filter(i=>i>=0);
 const locs=(p.locs||[]).filter(x=>LOC_INDEX[x]);
 openModal(
  '<div class="d-head"><span class="d-cat" style="color:#e8b4d8;border-color:#e8b4d8">历史人物</span><span class="d-time">'+esc(p.period)+'</span></div>'+
  '<h3 class="d-title">'+esc(p.name)+'</h3>'+
  '<p class="d-subtitle">'+esc(p.title)+'</p>'+
  '<p class="d-intro">'+esc(p.intro)+'</p>'+
 (PPL_REL[p.id]?'<button class="dyn-empbtn rel" id="m3dPplRelBtn">🕸 人物关系图</button>':"")+
  ((p.stories||[]).length?'<div class="d-section"><h5>典故与故事</h5>'+p.stories.map(s=>'<div class="d-story"><h6>'+esc(s.t)+'</h6><p>'+esc(s.d)+'</p></div>').join("")+'</div>':"")+
  (evs.length?'<div class="d-section"><h5>参与的重大事件</h5><div class="d-chips">'+evs.map(e=>'<button class="d-chip" data-nav="ev:'+e+'">'+esc(EV3D[e].time+' '+EV3D[e].name)+'</button>').join("")+'</div></div>':"")+
  (locs.length?'<div class="d-section"><h5>相关地点</h5>'+chipLinks("loc",locs)+'</div>':"")+
  bookChips(p.book)+
  '<div class="d-sep"></div><button class="d-nav" data-nav="ppl:return">返回列表</button>');
 const prb=document.getElementById("m3dPplRelBtn");if(prb)prb.onclick=()=>openRelGraph(p.id);
}
function openBook(id){
 const b=BOOKS[id];if(!b)return;
 openModal('<div class="d-head"><span class="d-cat" style="color:#9ecbff;border-color:#9ecbff">'+(b.k==="书"?"书籍推荐":"纪录片 / 节目")+'</span></div>'+
  '<h3 class="d-title">'+esc(b.t)+'</h3><p class="d-intro">'+esc(b.d)+'</p>'+
  '<div class="d-sep"></div><button class="d-nav" data-nav="book:return">返回书影列表</button>');
}
function focusLoc(id){
 const l=LOC_INDEX[id];if(!l)return;
 MAP3D.focusOn(l.lon,l.lat,190);
 MAP3D.locGroups.forEach(g=>g.ring.material.color.setHex(0xffd98a));
 const g=MAP3D.locGroups.find(x=>x.loc.id===id);
 if(g){g.ring.material.color.setHex(0xfff2cf);g.ring.material.opacity=1;}
}

/* ---- 启动 ---- */
async function start(){
 shell();
 try{
  await loadThree();
  MAP3D.setTapHandlers((i)=>{playing=false;clearTimeout(autoTimer);syncPlay();goto(i,true);openEvent(i);},
   (id)=>{playing=false;clearTimeout(autoTimer);syncPlay();focusLoc(id);openLoc(id);});
  MAP3D.init(CHINA_GEO);inited=true;
  document.getElementById("m3dLoading").style.display="none";
  document.getElementById("m3dChips").classList.add("ready");
  renderDynAxis();
  playing=true;syncPlay();goto(0,false);
 }catch(e){
  const l=document.getElementById("m3dLoading");
  l.innerHTML='<div style="line-height:1.9;text-align:center;padding:0 20px">3D 引擎加载失败（需要联网加载 three.js）。<br>请检查网络后刷新重试。</div>';
 }
}
window.addEventListener("DOMContentLoaded",start);
